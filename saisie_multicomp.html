<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Saisie Officielle Ligue LR</title>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-database-compat.js"></script>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #f0f2f5; margin: 0; padding: 20px; }
        .container { max-width: 1000px; margin: 0 auto; background: white; padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        header { border-bottom: 2px solid #007bff; padding-bottom: 15px; margin-bottom: 20px; display: flex; justify-content: space-between; align-items: center; }
        .form-group { background: #eef2f7; padding: 20px; border-radius: 10px; margin-bottom: 25px; border: 1px solid #d1d9e6; }
        .form-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; margin-bottom: 15px; }
        label { display: block; font-size: 0.85rem; font-weight: bold; color: #555; margin-bottom: 5px; }
        input, select { padding: 12px; border: 1px solid #bcc6d2; border-radius: 6px; font-size: 1rem; width: 100%; box-sizing: border-box; background: white; color: black; }
        .type-selector { background: #007bff; color: white; font-weight: bold; cursor: pointer; height: 50px; font-size: 1.2rem; border: none; border-radius: 8px; width: 100%; }
        .btn-add { background: #28a745; color: white; border: none; padding: 15px; border-radius: 6px; cursor: pointer; width: 100%; font-weight: bold; font-size: 1.1rem; transition: 0.2s; margin-top: 10px; }
        .btn-add:hover { background: #218838; }
        .shooter-item { display: flex; justify-content: space-between; align-items: center; padding: 15px; border-bottom: 1px solid #eee; }
        .score-input { width: 100px; padding: 10px; text-align: center; font-weight: bold; border: 2px solid #007bff; border-radius: 6px; color: #007bff; font-size: 1.2rem; }
        .save-anim { color: #28a745; font-weight: bold; margin-left: 10px; display: none; }
        .search-box { background: #fff; border: 2px solid #007bff; padding: 15px; border-radius: 8px; width: 100%; margin-bottom: 20px; font-size: 1.1rem; box-sizing: border-box; }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1 style="margin:0; color:#007bff;">🎯 Saisie des Résultats</h1>
        <a href="index_admin.html" style="text-decoration:none; font-weight:bold; color:#666;">← Retour</a>
    </header>

    <div class="form-group">
        <label>TYPE DE CHAMPIONNAT</label>
        <select id="typeSelector" class="type-selector" onchange="updateMenus()">
            <option value="TAR">TAR (Tir aux Armes Réglementaires)</option>
            <option value="ISSF10">ISSF / Para-Tir 10 Mètres</option>
            <option value="ISSF2550">ISSF / Para-Tir 25 & 50 Mètres</option>
            <option value="MLAIC">MLAIC (Armes Anciennes)</option>
            <option value="EDT">EDT (École de Tir)</option>
        </select>

        <h3 style="margin-top:25px; border-top: 1px solid #ccc; padding-top: 20px;">Nouveau Tireur</h3>
        <div class="form-row">
            <div><label>NOM</label><input type="text" id="newNom" placeholder="NOM"></div>
            <div><label>Prénom</label><input type="text" id="newPrenom" placeholder="Prénom"></div>
            <div><label>Club</label><input type="text" id="newClub" placeholder="Club"></div>
        </div>
        <div class="form-row">
            <div><label>Discipline</label><select id="newDiscipline"></select></div>
            <div><label>Catégorie</label><select id="newCategorie"></select></div>
        </div>
        <button class="btn-add" onclick="addShooter()">Enregistrer le tireur</button>
    </div>

    <input type="text" id="search" class="search-box" placeholder="🔍 Rechercher un nom, un club ou une discipline..." onkeyup="filterList()">
    <div id="shooterList"></div>
</div>

<script>
    const dataRef = {
        TAR: {
            disc: ["810 - Fusil Répétition manuelle", "811 - Fusils Modifiés Gros Calibre", "812 - Fusils Modifiés Petit Calibre", "813 - Challenges Armes à rép.", "815 - FSA - Gros Calibre", "816 - FSA - Petit Calibre", "820 - Carabine 22 lr", "821 - Carabine 22 semi-auto", "822 - Car. 22lr Assis", "823 - Carabine Match 22lr", "830 - Pistolet / Revolver", "831 - Pistolet Vitesse Réglementaire", "832 - Armes de poing Authentiques"],
            cats: ["Senior"]
        },
        ISSF10: {
            disc: ["100 - Pistolet 10m", "102 - Pistolet Vitesse 10m", "103 - Pistolet Standard 10m", "104 - Carabine 10m", "107 - Arbalète Match 10m", "171 - HP R1/R2 Car. 10m", "181 - HP P1/P2 Pistolet 10m"],
            cats: ["Minime F", "Minime G", "Cadet F", "Cadet G", "Junior Fille", "Junior Garçon", "Dame 1", "Dame 2", "Dame 3", "Senior 1", "Senior 2", "Senior 3"]
        },
        ISSF2550: {
            disc: ["250 - Pistolet Percussion Centrale", "251 - Pistolet 25m", "252 - Pistolet Vitesse 25m", "253 - Pistolet Standard 25m", "500 - Pistolet 50m", "501 - Carabine 60BC", "502 - Carabine 3x20", "271 - HP P3 Pistolet 25m", "571 - HP R6 Carabine 50m"],
            cats: ["Minime F", "Minime G", "Cadet F", "Cadet G", "Junior Fille", "Junior Garçon", "Dame 1", "Dame 2", "Senior 1", "Senior 2", "Senior 3"]
        },
        EDT: {
            disc: ["101 - Pistolet 3/7 EDT", "152 - Pistolet Vitesse 10m EDT", "154 - Carabine 10m EDT", "150 - Pistolet 10m EDT", "105 - Carabine 3 x 20 EDT", "158 - Arbalète Field EDT", "150/154 - Combiné EDT"],
            cats: ["Poussin Fille", "Poussin Garçon", "Benjamin Fille", "Benjamin Garçon", "Minime Fille", "Minime Garçon"]
        },
        MLAIC: {
            disc: ["601 - Miquelet Origine", "701 - Miquelet Réplique", "606 - Kuchenreuter Réplique", "712 - Mariette", "715 - Vetterli Réplique"],
            cats: ["Senior", "Junior"]
        }
    };

    function updateMenus() {
        const type = document.getElementById('typeSelector').value;
        const dMenu = document.getElementById('newDiscipline');
        const cMenu = document.getElementById('newCategorie');
        
        // On vide et on remplit
        dMenu.innerHTML = "";
        cMenu.innerHTML = "";

        dataRef[type].disc.forEach(d => {
            let opt = document.createElement("option");
            opt.value = d; opt.textContent = d;
            dMenu.appendChild(opt);
        });

        dataRef[type].cats.forEach(c => {
            let opt = document.createElement("option");
            opt.value = c; opt.textContent = c;
            cMenu.appendChild(opt);
        });
    }

    // INITIALISATION FIREBASE
    const firebaseConfig = {
        apiKey: "AIzaSyAvfMRtRrhh_e-27xHlwIx9c5DIdUQm6HM",
        authDomain: "resultats-tir-ligue-lr.firebaseapp.com",
        databaseURL: "https://resultats-tir-ligue-lr-default-rtdb.europe-west1.firebasedatabase.app",
        projectId: "resultats-tir-ligue-lr",
        storageBucket: "resultats-tir-ligue-lr.firebasestorage.app",
        appId: "1:468808300974:web:563a14cc4477c10b28303f"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();
    const params = new URLSearchParams(window.location.search);
    const compId = params.get('comp');

    let shootersData = [];

    if (compId) {
        db.ref(compId + '/shooters').on('value', (snap) => {
            const data = snap.val() || {};
            shootersData = Object.keys(data).map(key => ({ id: key, ...data[key] }));
            renderList(shootersData);
        });
    }

    function addShooter() {
        const nom = document.getElementById('newNom').value.toUpperCase();
        const prenom = document.getElementById('newPrenom').value;
        if (!nom || !prenom) return alert("Nom et Prénom requis");
        const s = {
            lastName: nom, firstName: prenom,
            discipline: document.getElementById('newDiscipline').value,
            category: document.getElementById('newCategorie').value,
            club: document.getElementById('newClub').value || "-",
            score: 0
        };
        db.ref(compId + '/shooters').push(s);
        document.getElementById('newNom').value = '';
        document.getElementById('newPrenom').value = '';
    }

    function renderList(list) {
        const cont = document.getElementById('shooterList');
        cont.innerHTML = '';
        list.sort((a,b) => a.lastName.localeCompare(b.lastName)).forEach(s => {
            cont.innerHTML += `<div class="shooter-item">
                <div class="shooter-info"><b>${s.lastName}</b> ${s.firstName}<div>${s.discipline} — ${s.category} — ${s.club}</div></div>
                <div><input type="number" step="0.1" class="score-input" value="${s.score || 0}" onchange="saveScore('${s.id}', this.value)"><span id="ok-${s.id}" class="save-anim">✔</span></div>
            </div>`;
        });
    }

    function saveScore(id, val) {
        db.ref(compId + '/shooters/' + id).update({ score: parseFloat(val) || 0 });
        const anim = document.getElementById('ok-' + id);
        anim.style.display = 'inline'; setTimeout(() => anim.style.display = 'none', 1000);
    }

    function filterList() {
        const q = document.getElementById('search').value.toLowerCase();
        const filtered = shootersData.filter(s => s.lastName.toLowerCase().includes(q) || s.firstName.toLowerCase().includes(q));
        renderList(filtered);
    }

    // COMMANDE DE RÉVEIL AU CHARGEMENT
    window.onload = function() {
        updateMenus();
    };
</script>
</body>
</html>
