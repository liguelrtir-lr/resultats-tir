<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Saisie Officielle Ligue LR — v1.20</title>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-database-compat.js"></script>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #f0f2f5; margin: 0; padding: 20px; }
        .container { max-width: 1000px; margin: 0 auto; background: white; padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); position: relative; }
        
        /* Marquage de version */
        .version-tag { position: absolute; top: 10px; right: 20px; font-size: 0.75rem; color: #999; font-weight: bold; }
        
        header { border-bottom: 2px solid #007bff; padding-bottom: 15px; margin-bottom: 20px; display: flex; justify-content: space-between; align-items: center; }
        .form-group { background: #eef2f7; padding: 20px; border-radius: 10px; margin-bottom: 25px; border: 2px solid #d1d9e6; }
        .form-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; margin-bottom: 15px; }
        input, select { padding: 12px; border: 1px solid #bcc6d2; border-radius: 6px; font-size: 1rem; width: 100%; box-sizing: border-box; }
        .btn-add { background: #28a745; color: white; border: none; padding: 15px; border-radius: 6px; cursor: pointer; width: 100%; font-weight: bold; font-size: 1.1rem; }
        .btn-update { background: #ffc107; color: #212529; display: none; }
        .shooter-item { display: flex; justify-content: space-between; align-items: center; padding: 15px; border-bottom: 1px solid #eee; }
        .actions { display: flex; align-items: center; gap: 10px; }
        .btn-action { border: none; padding: 8px; border-radius: 4px; cursor: pointer; font-size: 0.9rem; }
        .btn-edit { background: #e7f3ff; color: #007bff; }
        .btn-del { background: #ffeef0; color: #dc3545; }
        .score-input { width: 80px; padding: 10px; text-align: center; font-weight: bold; border: 2px solid #007bff; border-radius: 6px; color: #007bff; font-size: 1.1rem; }
        #suggestions { background: #fff; border: 1px solid #ccc; display: none; position: absolute; z-index: 100; width: 300px; border-radius: 4px; }
        .suggestion-item { padding: 10px; cursor: pointer; border-bottom: 1px solid #f0f0f0; }
    </style>
</head>
<body>

<div class="container">
    <div class="version-tag">VERSION 1.20 (11-05-2026)</div>
    <header>
        <h1 style="margin:0; color:#007bff;">🎯 Saisie des Résultats</h1>
        <a href="index_admin.html" style="text-decoration:none; font-weight:bold; color:#666;">← Retour</a>
    </header>

    <div class="form-group" id="formTireur">
        <label>CHAMPIONNAT :</label>
        <select id="typeSelector" onchange="updateMenus()" style="background:#007bff; color:white; font-weight:bold; margin-bottom:15px; border:none;">
            <option value="TAR">TAR (Tir aux Armes Réglementaires)</option>
            <option value="ISSF10">ISSF 10 mètres</option>
            <option value="ISSF2550">ISSF 25 & 50 mètres</option>
            <option value="MLAIC">MLAIC (Armes Anciennes)</option>
            <option value="EDT">EDT (École de Tir)</option>
        </select>

        <div class="form-row">
            <input type="hidden" id="editId">
            <div style="position:relative;">
                <label>NOM</label>
                <input type="text" id="newNom" onkeyup="chercherDansArchive(this.value)" autocomplete="off">
                <div id="suggestions"></div>
            </div>
            <div><label>Prénom</label><input type="text" id="newPrenom" autocomplete="off"></div>
            <div><label>Club</label><input type="text" id="newClub" autocomplete="off"></div>
        </div>
        <div class="form-row">
            <div><label>Discipline</label><select id="newDiscipline"></select></div>
            <div><label>Catégorie</label><select id="newCategorie"></select></div>
        </div>
        
        <button id="btnAdd" class="btn-add" onclick="addShooter()">Enregistrer le tireur</button>
        <button id="btnUpdate" class="btn-add btn-update" onclick="saveModification()">✅ Appliquer les corrections</button>
        <button id="btnCancel" class="btn-action" style="display:none; width:100%; margin-top:5px; background:#6c757d; color:white;" onclick="resetForm()">Annuler</button>
    </div>

    <input type="text" id="search" style="width:100%; padding:12px; margin-bottom:15px; border-radius:8px; border:2px solid #007bff;" placeholder="🔍 Filtrer la liste..." onkeyup="filterList()">
    <div id="shooterList"></div>
</div>

<script>
    const dataRef = {
        TAR: { disc: ["810 - Fusil Répétition manuelle", "811 - Fusils Modifiés Gros Calibre", "812 - Fusils Modifiés Petit Calibre", "813 - Challenges Armes à rép.", "815 - FSA - Gros Calibre", "816 - FSA - Petit Calibre", "820 - Carabine 22 lr", "821 - Carabine 22 semi-auto", "822 - Car. 22lr Assis", "823 - Carabine Match 22lr", "830 - Pistolet / Revolver", "831 - Pistolet Vitesse Réglementaire", "832 - Armes de poing Authentiques"], cats: ["Senior"] },
        ISSF10: { disc: ["100 - Pistolet 10m", "102 - Pistolet Vitesse 10m", "103 - Pistolet Standard 10m", "104 - Carabine 10m", "107 - Arbalète Match 10m", "109 - Cible Mobile 10m", "110 - Cible Mobile Mixte 10m", "025 - Arbalète Field 18m", "171 - HP R1/R2 Car. 10m", "173 - HP R3 Car. 10m", "174 - HP R4 Car. 10m", "175 - HP R5 Car. 10m", "177 - HP VIS Car. 10m deb.", "178 - HP VIP Car. 10m couchée", "181 - HP P1/P2 Pist. 10m", "183 - HP F5 Pist. Vitesse 10m", "184 - HP P5 Pist. Standard 10m"], cats: ["Minime F", "Minime G", "Cadet F", "Cadet G", "Junior Fille", "Junior Garçon", "Dame 1", "Dame 2", "Dame 3", "Senior 1", "Senior 2", "Senior 3"] },
        ISSF2550: { disc: ["250 - Pistolet Percussion Centrale", "251 - Pistolet 25m", "252 - Pistolet Vitesse 25m", "253 - Pistolet Standard 25m", "500 - Pistolet 50m", "501 - Carabine 60BC", "502 - Carabine 3x20", "271 - HP P3 Pistolet 25m", "273 - HP P4 Pistolet 50m", "571 - HP R6 Carabine 50m", "572 - HP R9 Carabine 50m"], cats: ["Minime F", "Minime G", "Cadet F", "Cadet G", "Junior Fille", "Junior Garçon", "Dame 1", "Dame 2", "Senior 1", "Senior 2", "Senior 3"] },
        EDT: { disc: ["101 - Pistolet 3/7 EDT", "150 - Pistolet 10m EDT", "152 - Pistolet Vitesse 10m EDT", "154 - Carabine 10m EDT", "105 - Carabine 3x20 EDT", "158 - Arbalète Field EDT", "150/154 - Combiné EDT", "161 - HP R5 Car. 10m couchée EDT", "162 - HP R3 Car. 10m couchée EDT", "163 - HP P1 Pistolet 10m EDT"], cats: ["Poussin Fille", "Poussin Garçon", "Benjamin Fille", "Benjamin Garçon", "Minime Fille", "Minime Garçon"] },
        MLAIC: { disc: ["601 - Miquelet Origine", "701 - Miquelet Réplique", "602 - Maximilien Origine", "702 - Maximilien Réplique", "603 - Minié Origine", "703 - Minié Réplique", "604 - Whitworth Origine", "704 - Whitworth Réplique", "605 - Cominazzo Origine", "705 - Cominazzo Réplique", "606 - Kuchenreuter Origine", "706 - Kuchenreuter Réplique", "607 - Colt", "712 - Mariette", "615 - Vetterli Origine", "715 - Vetterli Réplique", "637 - Lamarmora Origine", "737 - Lamarmora Réplique"], cats: ["Senior", "Junior"] }
    };

    const firebaseConfig = {
        apiKey: "AIzaSyAvfMRtRrhh_e-27xHlwIx9c5DIdUQm6HM",
        authDomain: "resultats-tir-ligue-lr.firebaseapp.com",
        databaseURL: "https://resultats-tir-ligue-lr-default-rtdb.europe-west1.firebasedatabase.app",
        projectId: "resultats-tir-ligue-lr",
        storageBucket: "resultats-tir-ligue-lr.firebasestorage.app",
        appId: "1:468808300974:web:563a14cc4477c10b28303f"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();
    const compId = new URLSearchParams(window.location.search).get('comp');

    let shootersData = [];
    let archiveTireurs = [];

    db.ref('Ligue_Tireurs_Archive').on('value', snap => { archiveTireurs = Object.values(snap.val() || {}); });
    if (compId) {
        db.ref(compId + '/shooters').on('value', snap => {
            const data = snap.val() || {};
            shootersData = Object.keys(data).map(key => ({ id: key, ...data[key] }));
            renderList(shootersData);
        });
    }

    function addShooter() {
        const nom = document.getElementById('newNom').value.toUpperCase().trim();
        const prenom = document.getElementById('newPrenom').value.trim();
        const club = document.getElementById('newClub').value.trim() || "-";
        if (!nom || !prenom) return alert("Nom et Prénom requis");
        const s = { lastName: nom, firstName: prenom, club: club, discipline: document.getElementById('newDiscipline').value, category: document.getElementById('newCategorie').value, score: 0 };
        db.ref(compId + '/shooters').push(s);
        const key = nom.replace(/[^a-zA-Z]/g, "") + "_" + prenom.replace(/[^a-zA-Z]/g, "");
        db.ref('Ligue_Tireurs_Archive/' + key).set({ lastName: nom, firstName: prenom, club: club });
        resetForm();
    }

    function prepareEdit(id) {
        const s = shootersData.find(x => x.id === id);
        document.getElementById('editId').value = id;
        document.getElementById('newNom').value = s.lastName;
        document.getElementById('newPrenom').value = s.firstName;
        document.getElementById('newClub').value = s.club;
        document.getElementById('btnAdd').style.display = 'none';
        document.getElementById('btnUpdate').style.display = 'block';
        document.getElementById('btnCancel').style.display = 'block';
        document.getElementById('formTireur').style.borderColor = '#ffc107';
        window.scrollTo(0,0);
    }

    function saveModification() {
        const id = document.getElementById('editId').value;
        const updates = {
            lastName: document.getElementById('newNom').value.toUpperCase().trim(),
            firstName: document.getElementById('newPrenom').value.trim(),
            club: document.getElementById('newClub').value.trim(),
            discipline: document.getElementById('newDiscipline').value,
            category: document.getElementById('newCategorie').value
        };
        db.ref(compId + '/shooters/' + id).update(updates);
        resetForm();
    }

    function deleteShooter(id) {
        if(confirm("Supprimer ce tireur ?")) { db.ref(compId + '/shooters/' + id).remove(); }
    }

    function resetForm() {
        document.getElementById('editId').value = '';
        document.getElementById('newNom').value = '';
        document.getElementById('newPrenom').value = '';
        document.getElementById('newClub').value = '';
        document.getElementById('btnAdd').style.display = 'block';
        document.getElementById('btnUpdate').style.display = 'none';
        document.getElementById('btnCancel').style.display = 'none';
        document.getElementById('formTireur').style.borderColor = '#d1d9e6';
    }

    function renderList(list) {
        const cont = document.getElementById('shooterList'); cont.innerHTML = '';
        list.sort((a,b) => a.lastName.localeCompare(b.lastName)).forEach(s => {
            cont.innerHTML += `
            <div class="shooter-item">
                <div style="flex:1;">
                    <b>${s.lastName}</b> ${s.firstName} <br>
                    <small>${s.discipline} | ${s.category} | ${s.club}</small>
                </div>
                <div class="actions">
                    <input type="number" step="0.1" class="score-input" value="${s.score || 0}" onchange="saveScore('${s.id}', this.value)">
                    <button class="btn-action btn-edit" onclick="prepareEdit('${s.id}')">✏️</button>
                    <button class="btn-action btn-del" onclick="deleteShooter('${s.id}')">🗑️</button>
                </div>
            </div>`;
        });
    }

    function saveScore(id, val) { db.ref(compId + '/shooters/' + id).update({ score: parseFloat(val) || 0 }); }
    
    function updateMenus() {
        const type = document.getElementById('typeSelector').value;
        document.getElementById('newDiscipline').innerHTML = dataRef[type].disc.map(d => `<option value="${d}">${d}</option>`).join('');
        document.getElementById('newCategorie').innerHTML = dataRef[type].cats.map(c => `<option value="${c}">${c}</option>`).join('');
    }

    function chercherDansArchive(val) {
        const box = document.getElementById('suggestions');
        if (val.length < 3) { box.style.display = 'none'; return; }
        const matches = archiveTireurs.filter(t => t.lastName.includes(val.toUpperCase())).slice(0, 5);
        if (matches.length > 0) {
            box.innerHTML = matches.map(m => `<div class="suggestion-item" onclick="remplirTireur('${m.lastName}', '${m.firstName}', '${m.club}')"><b>${m.lastName}</b> ${m.firstName}</div>`).join('');
            box.style.display = 'block';
        } else { box.style.display = 'none'; }
    }

    function remplirTireur(n, p, c) {
        document.getElementById('newNom').value = n; document.getElementById('newPrenom').value = p; document.getElementById('newClub').value = c;
        document.getElementById('suggestions').style.display = 'none';
    }

    function filterList() {
        const q = document.getElementById('search').value.toLowerCase();
        renderList(shootersData.filter(s => s.lastName.toLowerCase().includes(q) || s.firstName.toLowerCase().includes(q)));
    }

    window.onload = updateMenus;
</script>
</body>
</html>
