<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Saisie Officielle — Ligue LR</title>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-database-compat.js"></script>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #f0f2f5; margin: 0; padding: 20px; }
        .container { max-width: 900px; margin: 0 auto; background: white; padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        header { border-bottom: 2px solid #007bff; padding-bottom: 15px; margin-bottom: 20px; display: flex; justify-content: space-between; align-items: center; }
        
        .form-group { background: #f8f9fa; padding: 15px; border-radius: 8px; margin-bottom: 20px; border: 1px solid #e9ecef; }
        .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 10px; }
        input, select { padding: 10px; border: 1px solid #ddd; border-radius: 5px; font-size: 1rem; width: 100%; box-sizing: border-box; }
        
        .btn-add { background: #28a745; color: white; border: none; padding: 12px; border-radius: 5px; cursor: pointer; width: 100%; font-weight: bold; font-size: 1.1rem; }
        .search-box { background: #fff; border: 2px solid #007bff; padding: 12px; border-radius: 8px; width: 100%; margin-bottom: 20px; font-size: 1rem; }
        
        .shooter-item { display: flex; justify-content: space-between; align-items: center; padding: 12px; border-bottom: 1px solid #eee; }
        .shooter-info { flex-grow: 1; }
        .score-input { width: 80px; padding: 8px; text-align: center; font-weight: bold; border: 2px solid #007bff; border-radius: 5px; color: #007bff; }
        .save-anim { color: #28a745; font-weight: bold; margin-left: 10px; display: none; }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1 style="margin:0; color:#007bff;">Saisie des Résultats</h1>
        <a href="index_admin.html" style="text-decoration:none; color:#666;">← Retour</a>
    </header>

    <div class="form-group">
        <h3 style="margin-top:0;">Ajouter un nouveau tireur</h3>
        <div class="form-row">
            <input type="text" id="newNom" placeholder="Nom">
            <input type="text" id="newPrenom" placeholder="Prénom">
        </div>
        <div class="form-row">
            <select id="newDiscipline">
                <optgroup label="TAR (Épreuves 800)">
                    <option value="810 - Fusil Répétition">810 - Fusil Répétition</option>
                    <option value="812 - Fusil Semi-Auto">812 - Fusil Semi-Auto</option>
                    <option value="815 - Fusil Modifié">815 - Fusil Modifié</option>
                    <option value="816 - Fusil Semi-Auto Petit Calibre">816 - Fusil Semi-Auto PC</option>
                    <option value="820 - Carabine 22 LR">820 - Carabine 22 LR</option>
                    <option value="830 - Pistolet-Revolver">830 - Pistolet-Revolver</option>
                    <option value="831 - Vitesse Militaire">831 - Vitesse Militaire</option>
                    <option value="832 - Armes de poing authentiques">832 - Armes de poing auth.</option>
                </optgroup>
                <optgroup label="ISSF / Standard">
                    <option value="Pistolet 10m">Pistolet 10m</option>
                    <option value="Standard 10m">Standard 10m</option>
                    <option value="Pistolet 25m">Pistolet 25m</option>
                    <option value="Standard 25m">Standard 25m</option>
                    <option value="Percussion Centrale">Percussion Centrale</option>
                    <option value="Carabine 3x20">Carabine 3x20</option>
                    <option value="Vitesse 25m">Vitesse 25m</option>
                </optgroup>
            </select>
            <select id="newCategorie">
                <option value="JF">JF (Junior Fille)</option>
                <option value="JG">JG (Junior Garçon)</option>
                <option value="D1">D1 (Dame 1)</option>
                <option value="D2">D2 (Dame 2)</option>
                <option value="D3">D3 (Dame 3)</option>
                <option value="S1">S1 (Senior 1)</option>
                <option value="S2">S2 (Senior 2)</option>
                <option value="S3">S3 (Senior 3)</option>
                <optgroup label="Para-Tir">
                    <option value="P1">P1 (Pistolet SH1)</option>
                    <option value="P2">P2 (Pistolet SH1 Dame)</option>
                    <option value="R1">R1 (Carabine SH1)</option>
                </optgroup>
            </select>
        </div>
        <input type="text" id="newClub" placeholder="Club" style="margin-bottom:10px;">
        <button class="btn-add" onclick="addShooter()">Ajouter à la liste</button>
    </div>

    <input type="text" id="search" class="search-box" placeholder="Rechercher un tireur..." onkeyup="filterList()">
    <div id="shooterList"></div>
</div>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyAvfMRtRrhh_e-27xHlwIx9c5DIdUQm6HM",
        authDomain: "resultats-tir-ligue-lr.firebaseapp.com",
        databaseURL: "https://resultats-tir-ligue-lr-default-rtdb.europe-west1.firebasedatabase.app",
        projectId: "resultats-tir-ligue-lr",
        storageBucket: "resultats-tir-ligue-lr.firebasestorage.app",
        appId: "1:468808300974:web:563a14cc4477c10b28303f"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();
    const params = new URLSearchParams(window.location.search);
    const compId = params.get('comp');

    let shootersData = [];

    if (compId) {
        db.ref(compId + '/shooters').on('value', (snap) => {
            const data = snap.val() || {};
            shootersData = Object.keys(data).map(key => ({ id: key, ...data[key] }));
            renderList(shootersData);
        });
    }

    function addShooter() {
        const s = {
            lastName: document.getElementById('newNom').value.toUpperCase(),
            firstName: document.getElementById('newPrenom').value,
            discipline: document.getElementById('newDiscipline').value,
            category: document.getElementById('newCategorie').value,
            club: document.getElementById('newClub').value,
            score: 0
        };
        if (!s.lastName) return alert("Nom obligatoire");
        db.ref(compId + '/shooters').push(s);
        document.getElementById('newNom').value = '';
        document.getElementById('newPrenom').value = '';
    }

    function renderList(list) {
        const cont = document.getElementById('shooterList');
        cont.innerHTML = '';
        list.sort((a,b) => a.lastName.localeCompare(b.lastName)).forEach(s => {
            cont.innerHTML += `
                <div class="shooter-item">
                    <div class="shooter-info">
                        <b>${s.lastName}</b> ${s.firstName}
                        <div style="font-size:0.8rem; color:#666;">${s.discipline} | ${s.category} | ${s.club}</div>
                    </div>
                    <div>
                        <input type="number" class="score-input" value="${s.score || 0}" onchange="saveScore('${s.id}', this.value)">
                        <span id="ok-${s.id}" class="save-anim">✔</span>
                    </div>
                </div>`;
        });
    }

    function saveScore(id, val) {
        db.ref(compId + '/shooters/' + id).update({ score: parseInt(val) || 0 });
        const anim = document.getElementById('ok-' + id);
        anim.style.display = 'inline';
        setTimeout(() => anim.style.display = 'none', 1500);
    }

    function filterList() {
        const q = document.getElementById('search').value.toLowerCase();
        const filtered = shootersData.filter(s => s.lastName.toLowerCase().includes(q) || s.firstName.toLowerCase().includes(q));
        renderList(filtered);
    }
</script>
</body>
</html>
