<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>🎯 Interface de Saisie Universelle - Tir Sportif</title>

  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
  
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    body{
      font-family:'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      padding:20px; min-height:100vh;
    }
    .container{ max-width:1200px; margin:0 auto; }
    .header{
      background:white; padding:25px; border-radius:15px; margin-bottom:20px;
      box-shadow:0 10px 30px rgba(0,0,0,0.2); text-align:center;
    }
    .header h1{ color:#667eea; font-size:2.2em; margin-bottom:5px; font-weight: 900; }
    .main-content{ display:grid; grid-template-columns: 1fr 1fr; gap:20px; margin-bottom:20px; }
    .card{ background:white; padding:25px; border-radius:15px; box-shadow:0 10px 30px rgba(0,0,0,0.2); }
    .card h2 { color: #667eea; margin-bottom: 20px; font-size: 1.5em; border-bottom: 2px solid #f0f0f0; padding-bottom: 10px;}
    .form-group{ margin-bottom:15px; }
    .form-group label{ display:block; margin-bottom:5px; font-weight:bold; color:#555; }
    input, select { width:100%; padding:12px; border:2px solid #ddd; border-radius:8px; font-size:1em; }
    .btn{ width:100%; padding:15px; border:none; border-radius:8px; font-size:1.1em; font-weight:bold; cursor:pointer; margin-top:10px; transition: 0.3s; }
    .btn-primary{ background:#667eea; color:white; }
    .btn-secondary{ background:#28a745; color:white; }
    
    .qr-section{ background:#f8f9fa; padding:20px; border-radius:12px; text-align:center; margin-top:20px; border: 1px solid #eee;}
    #qrcode{ display:inline-block; padding:15px; background:white; border-radius:10px; margin:15px 0; border: 1px solid #ddd;}
    .public-url{ background:white; padding:10px; border-radius:5px; word-break:break-all; margin-top:10px; font-family:monospace; border:2px dashed #667eea; font-size: 0.85em; }

    .shooters-list{ max-height:60vh; overflow-y:auto; margin-top:15px; }
    .shooter-item{ background:#f8f9fa; padding:15px; margin-bottom:10px; border-radius:8px; border-left:6px solid #667eea; display:flex; justify-content:space-between; align-items:center; }
    .score-val{ font-size:1.8em; font-weight:900; color:#667eea; }
    .category-badge{ padding:4px 12px; border-radius:20px; font-size:0.8em; font-weight:bold; margin-right:5px; background:#e0e7ff; color:#3730a3; }
    
    @media (max-width:768px){ .main-content{ grid-template-columns:1fr; } }
  </style>
</head>

<body>
  <div class="container">
    <div class="header">
      <h1>🎯 Interface de Saisie Universelle</h1>
      <div id="displayCompetitionName" style="font-weight:bold; color:#555;">Configuration requise</div>
      <div id="connectionStatus" style="display:inline-block; padding:5px 15px; border-radius:20px; background:#f8d7da; color:#721c24; font-weight:bold; margin-top:10px;">🔴 Déconnecté</div>
    </div>

    <div class="main-content">
      <div class="card">
        <h2>⚙️ Configuration</h2>
        <div class="form-group">
          <label>Nom de la compétition</label>
          <input type="text" id="competitionName" placeholder="Ex: Championnat Régional" />
        </div>
        <div class="form-group">
          <label>Code Compétition (ID Firebase)</label>
          <input type="text" id="compCodeInput" placeholder="Ex: amical_uzes" />
        </div>
        <div style="display:flex; gap:10px;">
            <button class="btn btn-secondary" onclick="applyCompCode()" style="flex:1">✅ Appliquer le Code</button>
            <button class="btn btn-primary" onclick="saveConfig()" style="flex:1">💾 Sauvegarder Config</button>
        </div>
        
        <div class="qr-section">
          <h3 style="color:#667eea; font-size: 1.1em;">📱 Partager l'affichage (GitHub)</h3>
          <div id="qrcode"></div>
          <button class="btn btn-primary" onclick="generateQRCode()">🔄 Générer le QR Code</button>
          <div class="public-url" id="publicUrl" style="display:none;"></div>
        </div>
      </div>

      <div class="card">
        <h2>➕ Ajouter un Résultat</h2>
        <div style="display:flex; gap:10px; margin-bottom:15px;">
          <div style="flex:1">
            <label>Nom</label>
            <input type="text" id="lastName" placeholder="NOM" />
          </div>
          <div style="flex:1">
            <label>Prénom</label>
            <input type="text" id="firstName" placeholder="Prénom" />
          </div>
        </div>
        <div class="form-group">
          <label>Club</label>
          <input type="text" id="club" placeholder="Ex: ST Uzès" />
        </div>

        <div class="form-group">
          <label>Discipline (ISSF, TAR, EDT, Para)</label>
          <select id="discipline" onchange="autoAdjustMaxScore()">
            <option value="">-- Sélectionner --</option>
            <optgroup label="ISSF 10/25/50m">
              <option value="Pistolet 10 m">Pistolet 10 m</option>
              <option value="Carabine 10 m">Carabine 10 m (Dixièmes)</option>
              <option value="Pistolet 25 mètres">252 - Pistolet 25m</option>
              <option value="Carabine 50m 60BC">501 - Carabine 50m 60BC (Dixièmes)</option>
            </optgroup>
            <optgroup label="TAR & EDT">
              <option value="TAR - Pistolet/Révolver">TAR - Pistolet/Révolver</option>
              <option value="TAR - Carabine 22 LR">TAR - Carabine 22 LR</option>
              <option value="EDT - Pistolet 10m">EDT - Pistolet 10m</option>
              <option value="EDT - Carabine 10m">EDT - Carabine 10m</option>
            </optgroup>
            <optgroup label="Para-Tir (Capture d'écran)">
              <option value="571 - HP - R6 Car. 50m 60 BC (SH1)">571 - R6 Carabine (Dixièmes)</option>
              <option value="271 - HP - P3 - Pistolet 25m (SH1)">271 - P3 Pistolet 25m</option>
              <option value="272 - HP - P4 - Pistolet 50m (SH1)">272 - P4 Pistolet 50m</option>
            </optgroup>
          </select>
        </div>

        <div class="form-group">
          <label>Catégorie</label>
          <select id="category">
            <option value="">-- Sélectionner --</option>
            <option>Minime Fille</option><option>Minime Garçon</option>
            <option>Cadet Fille</option><option>Cadet Garçon</option>
            <option>Dame 1</option><option>Senior 1</option>
            <option>Para-Tir Homme</option><option>Para-Tir Dame</option>
          </select>
        </div>

        <div class="form-group">
          <label>Score / <span id="maxScoreDisplay">---</span></label>
          <input type="number" id="score" step="0.1" placeholder="Ex: 580 ou 612.4" />
        </div>
        <button class="btn btn-primary" onclick="addShooter()">🚀 Enregistrer</button>
      </div>
    </div>

    <div class="card">
      <h2>📊 Liste locale (Session)</h2>
      <div class="shooters-list" id="shootersList"></div>
    </div>
  </div>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyAvfMRtRrhh_e-27xHlwIx9c5DIdUQm6HM",
      authDomain: "resultats-tir-ligue-lr.firebaseapp.com",
      databaseURL: "https://resultats-tir-ligue-lr-default-rtdb.europe-west1.firebasedatabase.app",
      projectId: "resultats-tir-ligue-lr",
      storageBucket: "resultats-tir-ligue-lr.firebasestorage.app",
      appId: "1:468808300974:web:563a14cc4477c10b28303f"
    };

    let database, shootersRef, configRef;
    let COMPETITION_ID = new URLSearchParams(window.location.search).get('comp') || 'GENERAL';
    const GITHUB_URL = "https://liguelrtir-lr.github.io/resultats-tir/affichage_multicomp.html";

    function init() {
      firebase.initializeApp(firebaseConfig);
      database = firebase.database();
      shootersRef = database.ref(`${COMPETITION_ID}/shooters`);
      configRef = database.ref(`${COMPETITION_ID}/config`);
      
      const status = document.getElementById('connectionStatus');
      status.textContent = "✅ Connecté : " + COMPETITION_ID;
      status.style.background = "#d4edda"; status.style.color = "#155724";
      document.getElementById('compCodeInput').value = COMPETITION_ID;
      
      loadConfig();
      listenData();
    }

    function autoAdjustMaxScore() {
      const disc = document.getElementById('discipline').value;
      const scoreInput = document.getElementById('score');
      let max = 600; let step = 1;
      if (disc.includes("Dixièmes") || disc.includes("60BC") || disc.includes("Carabine 10 m")) {
        max = 654.0; step = 0.1;
      } else if (disc.includes("TAR")) { max = 200; }
      document.getElementById('maxScoreDisplay').textContent = max;
      scoreInput.step = step;
    }

    function applyCompCode() {
      const code = document.getElementById('compCodeInput').value.trim();
      if (code) { window.location.href = window.location.pathname + "?comp=" + code; }
    }

    function generateQRCode() {
      const qrContainer = document.getElementById('qrcode');
      const urlContainer = document.getElementById('publicUrl');
      qrContainer.innerHTML = "";
      const publicUrl = `${GITHUB_URL}?comp=${encodeURIComponent(COMPETITION_ID)}`;
      
      new QRCode(qrContainer, {
        text: publicUrl, width: 180, height: 180, colorDark: "#667eea", colorLight: "#ffffff"
      });
      urlContainer.style.display = 'block';
      urlContainer.innerHTML = `<strong>Lien GitHub :</strong> <a href="${publicUrl}" target="_blank">${publicUrl}</a>`;
    }

    function addShooter() {
      const data = {
        lastName: document.getElementById('lastName').value.toUpperCase().trim(),
        firstName: document.getElementById('firstName').value.trim(),
        club: document.getElementById('club').value.trim(),
        discipline: document.getElementById('discipline').value,
        category: document.getElementById('category').value,
        score: parseFloat(document.getElementById('score').value),
        maxScore: parseFloat(document.getElementById('maxScoreDisplay').textContent),
        timestamp: Date.now()
      };
      if (!data.lastName || isNaN(data.score)) return alert("Nom et Score obligatoires !");
      shootersRef.push(data).then(() => {
        document.getElementById('score').value = "";
        document.getElementById('lastName').value = "";
        document.getElementById('firstName').value = "";
        document.getElementById('lastName').focus();
      });
    }

    function listenData() {
      shootersRef.on('value', (snap) => {
        const list = document.getElementById('shootersList');
        list.innerHTML = "";
        const data = snap.val();
        if (data) {
          Object.entries(data).reverse().slice(0, 10).forEach(([id, s]) => {
            list.innerHTML += `<div class="shooter-item">
                <div><strong>${s.lastName} ${s.firstName}</strong><br><small>${s.discipline}</small></div>
                <div class="score-val">${s.score}</div>
                <button onclick="deleteS('${id}')" style="background:none; border:none; cursor:pointer;">🗑️</button>
            </div>`;
          });
        }
      });
    }

    function deleteS(id) { if(confirm("Supprimer ?")) shootersRef.child(id).remove(); }
    function saveConfig() { configRef.set({ name: document.getElementById('competitionName').value }); }
    function loadConfig() { configRef.once('value', s => { if(s.val()) { document.getElementById('displayCompetitionName').textContent = s.val().name; document.getElementById('competitionName').value = s.val().name; } }); }

    init();
  </script>
</body>
</html>
