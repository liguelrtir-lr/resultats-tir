<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <title>🎯 Résultats TAR - Live</title>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
  
  <style>
    body {
      font-family: sans-serif;
      background: #0f2027;
      color: white;
      margin: 0;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .header { background: #1e3c72; padding: 15px; text-align: center; }
    .ranking-container {
      flex: 1;
      background: white;
      color: #111;
      margin: 15px;
      border-radius: 15px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .ranking-title { font-size: 1.5em; padding: 15px; text-align: center; color: #1e3c72; font-weight: bold; border-bottom: 2px solid #eee; }
    .grid-head { display: grid; grid-template-columns: 60px 1fr 180px 120px; background: #eee; font-weight: bold; }
    .grid-scroll { flex: 1; overflow-y: auto; scroll-behavior: smooth; }
    .grid-row { display: grid; grid-template-columns: 60px 1fr 180px 120px; border-bottom: 1px solid #eee; align-items: center; }
    .cell { padding: 12px; }
    .rank { font-weight: bold; text-align: center; color: #1e3c72; }
    .score { font-weight: bold; text-align: center; }
    .footer { padding: 10px; font-size: 0.8em; text-align: center; opacity: 0.6; }
    .indicator { color: #4f7cff; font-weight: bold; margin-bottom: 5px; }
  </style>
</head>

<body>
  <div class="header">
    <h2 id="competitionName">Chargement...</h2>
    <div id="clock">00:00:00</div>
  </div>

  <div class="ranking-container" id="rankingContainer"></div>
  
  <div class="footer">
    <div class="indicator" id="autoRotateIndicator">Initialisation...</div>
    Espace pour Pause • Double-clic pour Plein écran
  </div>

  <script>
    const COMPETITION_ID = (new URLSearchParams(window.location.search).get('comp') || 'TAR');
    
    const firebaseConfig = {
      apiKey: "AIzaSyAvfMRtRrhh_e-27xHlwIx9c5DIdUQm6HM",
      authDomain: "resultats-tir-ligue-lr.firebaseapp.com",
      databaseURL: "https://resultats-tir-ligue-lr-default-rtdb.europe-west1.firebasedatabase.app",
      projectId: "resultats-tir-ligue-lr",
      storageBucket: "resultats-tir-ligue-lr.firebasestorage.app",
      appId: "1:468808300974:web:563a14cc4477c10b28303f"
    };

    let allShooters = [], rotateViews = [], currentIdx = 0;
    let autoRotate = true, perViewSec = 8;
    let mainTimer = null, scrollInterval = null;

    // 1. Initialisation Firebase
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    db.ref(`competitions/${COMPETITION_ID}/config/name`).on('value', s => {
      document.getElementById('competitionName').textContent = s.val() || 'Compétition';
    });

    db.ref(`competitions/${COMPETITION_ID}/shooters`).on('value', s => {
      const data = s.val() || {};
      allShooters = Object.values(data);
      preparerVues();
      lancerCycle();
    });

    // 2. Préparation des catégories
    function preparerVues() {
      const v = new Map();
      allShooters.forEach(s => {
        const d = (s.discipline || 'Sans nom').trim();
        const c = (s.category || '').trim();
        if (!v.has(d)) v.set(d, new Set());
        if (c) v.get(d).add(c);
      });
      
      rotateViews = [];
      Array.from(v.keys()).sort().forEach(d => {
        const cats = Array.from(v.get(d)).sort();
        if (cats.length === 0) rotateViews.push({ d, c: '' });
        else cats.forEach(c => rotateViews.push({ d, c }));
      });
    }

    // 3. Gestion du Cycle
    function lancerCycle() {
      clearAllTimers();
      if (!rotateViews.length) return;

      const vue = rotateViews[currentIdx];
      afficherTableau(vue);

      // On laisse un petit délai pour que le DOM se dessine avant de calculer le scroll
      setTimeout(() => {
        const scroller = document.getElementById('tableScroll');
        const estLong = scroller && scroller.scrollHeight > scroller.clientHeight;

        if (estLong && autoRotate) {
          demarrerScrollAuto(scroller);
        } else {
          mainTimer = setTimeout(passerSuivant, perViewSec * 1000);
        }
        majIndicateur();
      }, 500);
    }

    function demarrerScrollAuto(scroller) {
      const max = scroller.scrollHeight - scroller.clientHeight;
      // Vitesse : on veut parcourir le reste du temps (environ 6s)
      const vitesse = max / ( (perViewSec - 2) * 30 ); 
      
      scrollInterval = setInterval(() => {
        if (!autoRotate) return;
        scroller.scrollTop += vitesse;
        
        if (scroller.scrollTop >= max - 1) {
          clearInterval(scrollInterval);
          // Pause en bas de 2s avant de changer
          mainTimer = setTimeout(passerSuivant, 2000);
        }
      }, 33);
    }

    function passerSuivant() {
      if (!autoRotate) return;
      currentIdx = (currentIdx + 1) % rotateViews.length;
      lancerCycle();
    }

    function clearAllTimers() {
      clearTimeout(mainTimer);
      clearInterval(scrollInterval);
    }

    // 4. Affichage pur
    function afficherTableau(vue) {
      const container = document.getElementById('rankingContainer');
      const tireurs = allShooters
        .filter(s => s.discipline === vue.d && (vue.c === '' || s.category === vue.c))
        .sort((a,b) => (Number(b.score)||0) - (Number(a.score)||0));

      let html = `
        <div class="ranking-title">${vue.d} ${vue.c ? ' - ' + vue.c : ''}</div>
        <div class="grid-head">
          <div class="cell">#</div><div class="cell">Nom / Prénom</div><div class="cell">Club</div><div class="cell">Score</div>
        </div>
        <div class="grid-scroll" id="tableScroll">
      `;

      tireurs.forEach((s, i) => {
        html += `
          <div class="grid-row">
            <div class="cell rank">${i+1}</div>
            <div class="cell"><b>${s.lastName || ''}</b> ${s.firstName || ''}</div>
            <div class="cell">${s.club || '-'}</div>
            <div class="cell score">${s.score || 0} <small>/${s.maxScore || 0}</small></div>
          </div>
        `;
      });

      container.innerHTML = html + `</div>`;
    }

    function majIndicateur() {
      const el = document.getElementById('autoRotateIndicator');
      if (!autoRotate) { el.textContent = "⏸ MODE TV EN PAUSE"; return; }
      const next = rotateViews[(currentIdx + 1) % rotateViews.length];
      el.textContent = `↻ PROCHAIN : ${next ? next.d + ' ' + next.c : '...'}`;
    }

    // Horloge & Clavier
    setInterval(() => { document.getElementById('clock').textContent = new Date().toLocaleTimeString(); }, 1000);
    
    document.addEventListener('keydown', e => {
      if (e.code === 'Space') {
        e.preventDefault();
        autoRotate = !autoRotate;
        if (autoRotate) lancerCycle();
        else majIndicateur();
      }
    });
  </script>
</body>
</html>
