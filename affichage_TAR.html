<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>🎯 Résultats Provisoires - TAR</title>

  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
  
  <style>
    body {
      font-family:'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #0f2027 0%, #203a43 50%, #2c5364 100%);
      color:#fff;
      margin:0;
      padding-bottom: 80px;
    }

    .header {
      position: sticky;
      top: 0;
      z-index: 1000;
      text-align:center;
      padding:18px 30px;
      background: linear-gradient(135deg, #4f7cff 0%, #7c3aed 50%, #4f7cff 100%);
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }
    .header h1 { font-size: 2em; margin: 0; font-weight: 950; letter-spacing: 2px; color: #fff; }
    .competition-name { font-size:1.1em; color: #fff; margin-top:5px; font-weight:700; }
    .header-clock { font-size:1.5em; font-weight:900; color:rgba(255,255,255,0.9); letter-spacing:3px; margin-top:5px; }
    
    .live-indicator {
      display:inline-block;
      padding:4px 12px;
      background:red;
      border-radius:20px;
      font-weight:800;
      font-size:.7em;
      animation:pulse 2s infinite;
      margin-top:5px;
    }

    .ranking-container {
      background: rgba(255,255,255,0.98);
      border-radius: 20px;
      margin: 20px;
      overflow: hidden;
      color: #111;
      box-shadow: 0 20px 50px rgba(0,0,0,0.4);
    }

    .ranking-title {
      font-size: 1.8em;
      color: #1e3c72;
      text-align: center;
      padding: 20px;
      font-weight: 800;
      background: #f8fafc;
      border-bottom: 3px solid #1e3c72;
    }

    table { width: 100%; border-collapse: collapse; }
    th { background: #1e3c72; color: white; padding: 15px; text-transform: uppercase; font-size: 0.9em; }
    td { padding: 15px; border-bottom: 1px solid #e2e8f0; font-size: 1.2em; }
    
    /* Styles pour les médailles */
    .medal-1 { background: linear-gradient(90deg, #ffd700, #fff2a3) !important; color: #000 !important; font-weight: bold; }
    .medal-2 { background: linear-gradient(90deg, #c0c0c0, #e8e8e8) !important; color: #000 !important; font-weight: bold; }
    .medal-3 { background: linear-gradient(90deg, #cd7f32, #ffb36b) !important; color: #000 !important; font-weight: bold; }

    .rank-cell { font-weight: 900; color: #1e3c72; font-size: 1.4em; text-align: center; width: 80px; }
    .medal-1 .rank-cell, .medal-2 .rank-cell, .medal-3 .rank-cell { color: #000; }
    .score-cell { font-weight: 900; text-align: center; width: 150px; }

    .footer-bar {
      position: fixed;
      bottom: 0; width: 100%;
      background: rgba(15, 32, 39, 0.95);
      padding: 10px;
      text-align: center;
      z-index: 1000;
    }
    .rotate-info { color: #4f7cff; font-weight: bold; }

    @keyframes pulse { 0% {opacity:1} 50% {opacity:0.5} 100% {opacity:1} }
  </style>
</head>
<body>

  <div class="header">
    <h1>🎯 Résultats Provisoires</h1>
    <div class="competition-name" id="competitionName">Chargement...</div>
    <div class="header-clock" id="headerClock">--:--:--</div>
    <div class="live-indicator">🔴 EN DIRECT</div>
  </div>

  <div class="ranking-container" id="rankingContainer"></div>

  <div class="footer-bar">
    <div class="rotate-info" id="rotateIndicator">Initialisation...</div>
  </div>

  <script>
    const COMPETITION_ID = (new URLSearchParams(window.location.search).get('comp') || 'TAR');
    const firebaseConfig = {
      apiKey: "AIzaSyAvfMRtRrhh_e-27xHlwIx9c5DIdUQm6HM",
      authDomain: "resultats-tir-ligue-lr.firebaseapp.com",
      databaseURL: "https://resultats-tir-ligue-lr-default-rtdb.europe-west1.firebasedatabase.app",
      projectId: "resultats-tir-ligue-lr",
      storageBucket: "resultats-tir-ligue-lr.firebasestorage.app",
      appId: "1:468808300974:web:563a14cc4477c10b28303f"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    let allShooters = [], views = [], currentIdx = 0, isPaused = false;
    const START_PAUSE = 3000; // 3 secondes de pause au début
    const END_PAUSE = 2500;   // 2.5 secondes de pause en bas
    const MIN_TIME = 8000;    // Temps min par page

    db.ref(`competitions/${COMPETITION_ID}/config/name`).on('value', s => {
      document.getElementById('competitionName').textContent = s.val() || 'Compétition';
    });

    db.ref(`competitions/${COMPETITION_ID}/shooters`).on('value', s => {
      allShooters = Object.values(s.val() || {});
      const map = new Map();
      allShooters.forEach(sh => {
        const key = `${sh.discipline}|${sh.category || ''}`;
        if (!map.has(key)) map.set(key, { d: sh.discipline, c: sh.category || '' });
      });
      views = Array.from(map.values()).sort((a,b) => a.d.localeCompare(b.d));
      lancerCycle();
    });

    async function lancerCycle() {
      if (isPaused || !views.length) return;

      const vue = views[currentIdx];
      afficherDonnees(vue);

      // On attend 3 secondes AVANT de commencer quoi que ce soit
      await new Promise(r => setTimeout(r, START_PAUSE)); 

      const totalH = document.body.scrollHeight;
      const viewH = window.innerHeight;

      if (totalH > viewH) {
        const dist = totalH - viewH;
        const duration = Math.max(MIN_TIME, dist * 15); 
        await smoothScroll(dist, duration);
        await new Promise(r => setTimeout(r, END_PAUSE)); 
      } else {
        await new Promise(r => setTimeout(r, MIN_TIME));
      }

      currentIdx = (currentIdx + 1) % views.length;
      lancerCycle();
    }

    function afficherDonnees(vue) {
      window.scrollTo(0, 0);
      const container = document.getElementById('rankingContainer');
      const data = allShooters
        .filter(s => s.discipline === vue.d && (s.category || '') === vue.c)
        .sort((a,b) => (Number(b.score)||0) - (Number(a.score)||0));

      let html = `<div class="ranking-title">${vue.d} ${vue.c ? '<br><small>'+vue.c+'</small>' : ''}</div>`;
      html += `<table><thead><tr><th>#</th><th>Tireur</th><th>Club</th><th>Score</th></tr></thead><tbody>`;
      
      data.forEach((s, i) => {
        let medalClass = "";
        if (i === 0) medalClass = "medal-1";
        else if (i === 1) medalClass = "medal-2";
        else if (i === 2) medalClass = "medal-3";

        html += `<tr class="${medalClass}">
          <td class="rank-cell">${i+1}</td>
          <td><b>${s.lastName}</b> ${s.firstName}</td>
          <td>${s.club || ''}</td>
          <td class="score-cell">${s.score} <small style="opacity:0.5">/${s.maxScore}</small></td>
        </tr>`;
      });
      container.innerHTML = html + `</tbody></table>`;
      
      const next = views[(currentIdx + 1) % views.length];
      document.getElementById('rotateIndicator').textContent = next ? `↻ PROCHAIN : ${next.d} ${next.c}` : "";
    }

    function smoothScroll(distance, duration) {
      return new Promise(resolve => {
        const start = performance.now();
        function step(now) {
          if (isPaused) return; 
          const elapsed = now - start;
          const progress = Math.min(elapsed / duration, 1);
          window.scrollTo(0, distance * progress);
          if (progress < 1) requestAnimationFrame(step);
          else resolve();
        }
        requestAnimationFrame(step);
      });
    }

    setInterval(() => { document.getElementById('headerClock').textContent = new Date().toLocaleTimeString(); }, 1000);
    
    document.addEventListener('keydown', e => {
      if(e.code === 'Space') { 
        isPaused = !isPaused; 
        document.getElementById('rotateIndicator').textContent = isPaused ? "⏸ PAUSE" : "↻ REPRISE...";
        if (!isPaused) lancerCycle();
      }
    });
  </script>
</body>
</html>
