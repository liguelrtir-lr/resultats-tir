<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>🎯 Résultats Provisoires - TAR</title>

  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
  
  <style>
    body {
      font-family:'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #0f2027 0%, #203a43 50%, #2c5364 100%);
      color:#fff;
      margin:0;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden; /* Empêche le scroll de toute la page */
    }

    .header {
      padding:15px 30px;
      background: rgba(0,0,0,0.5);
      backdrop-filter: blur(10px);
      border-bottom: 2px solid #4f7cff;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 1000;
    }

    /* ZONE DE DÉFILEMENT */
    #main-container {
      flex: 1;
      overflow-y: auto;
      padding: 0 20px 80px 20px;
      position: relative;
      scroll-behavior: smooth;
    }
    #main-container::-webkit-scrollbar { display: none; }

    /* TITRE DISCIPLINE FIGÉ */
    .cat-header {
      position: sticky;
      top: 0;
      z-index: 100;
      background: linear-gradient(135deg, #4f7cff 0%, #7c3aed 100%);
      padding: 15px;
      text-align: center;
      border-radius: 0 0 15px 15px;
      box-shadow: 0 5px 15px rgba(0,0,0,0.3);
      margin-bottom: 10px;
    }

    table { width: 100%; border-collapse: collapse; font-size: 1.4em; background: rgba(255,255,255,0.98); color: #111; border-radius: 15px; overflow: hidden; }
    
    /* TITRES COLONNES FIGÉS */
    thead th {
      position: sticky;
      top: 65px; /* Se colle sous le titre violet */
      z-index: 99;
      background: #1e3c72;
      color: white;
      padding: 15px;
      text-transform: uppercase;
      font-size: 0.7em;
    }

    td { padding: 15px; border-bottom: 1px solid #e2e8f0; }
    
    /* PODIUM */
    .medal-1 { background: linear-gradient(90deg, #ffd700, #fff2a3) !important; color: #000 !important; font-weight: bold; }
    .medal-2 { background: linear-gradient(90deg, #c0c0c0, #e8e8e8) !important; color: #000 !important; font-weight: bold; }
    .medal-3 { background: linear-gradient(90deg, #cd7f32, #ffb36b) !important; color: #000 !important; font-weight: bold; }

    .rank-cell { font-weight: 900; color: #1e3c72; text-align: center; width: 80px; }
    .medal-1 .rank-cell, .medal-2 .rank-cell, .medal-3 .rank-cell { color: #000; }
    .score-cell { font-weight: 900; text-align: center; width: 150px; color: #1e3c72; }

    .footer-bar {
      position: fixed;
      bottom: 0; width: 100%;
      background: rgba(15, 32, 39, 0.95);
      padding: 12px;
      text-align: center;
      z-index: 1000;
      border-top: 1px solid #4f7cff;
    }
    .rotate-info { color: #4f7cff; font-weight: bold; font-family: monospace; }
  </style>
</head>
<body>

  <div class="header">
    <h1 id="compName" style="margin:0; font-size: 1.5em; font-weight:950; letter-spacing:2px;">CHARGEMENT...</h1>
    <div id="headerClock" style="font-size: 1.5em; font-weight: 900; letter-spacing:3px;">00:00:00</div>
  </div>

  <div id="main-container">
    <div class="cat-header">
      <h2 id="currentCat" style="margin:0; font-size: 1.8em; font-weight: 800;">---</h2>
    </div>

    <table id="rankTable">
      <thead>
        <tr>
          <th>#</th>
          <th>Tireur</th>
          <th>Club</th>
          <th style="text-align:center">Score</th>
        </tr>
      </thead>
      <tbody id="resultsTable"></tbody>
    </table>
  </div>

  <div class="footer-bar">
    <div class="rotate-info" id="rotateIndicator">Initialisation...</div>
  </div>

  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const COMPETITION_ID = urlParams.get('comp') || 'TAR';

    const firebaseConfig = {
      apiKey: "AIzaSyAvfMRtRrhh_e-27xHlwIx9c5DIdUQm6HM",
      authDomain: "resultats-tir-ligue-lr.firebaseapp.com",
      databaseURL: "https://resultats-tir-ligue-lr-default-rtdb.europe-west1.firebasedatabase.app",
      projectId: "resultats-tir-ligue-lr",
      storageBucket: "resultats-tir-ligue-lr.firebasestorage.app",
      appId: "1:468808300974:web:563a14cc4477c10b28303f"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    let allShooters = [], views = [], currentIdx = 0, isPaused = false;
    let scrollInterval;

    // Chemin corrigé : on enlève "competitions/" car l'admin écrit à la racine
    db.ref(`${COMPETITION_ID}/config/name`).on('value', s => {
      document.getElementById('compName').textContent = s.val() || COMPETITION_ID;
    });

    db.ref(`${COMPETITION_ID}/shooters`).on('value', s => {
      const data = s.val();
      if (!data) {
        document.getElementById('rotateIndicator').textContent = "Aucune donnée trouvée pour " + COMPETITION_ID;
        return;
      }
      
      allShooters = Object.values(data);
      const map = new Map();
      allShooters.forEach(sh => {
        const key = `${sh.discipline}|${sh.category || ''}`;
        if (!map.has(key)) map.set(key, { d: sh.discipline, c: sh.category || '' });
      });
      views = Array.from(map.values()).sort((a,b) => a.d.localeCompare(b.d));
      lancerCycle();
    });

    function lancerCycle() {
      if (isPaused || !views.length) return;
      afficherDonnees(views[currentIdx]);
      
      const container = document.getElementById('main-container');
      container.scrollTop = 0;
      clearInterval(scrollInterval);

      setTimeout(() => {
        const maxScroll = container.scrollHeight - container.clientHeight;
        if (maxScroll > 10) {
          const step = maxScroll / (12000 / 30); // Défilement sur 12s
          scrollInterval = setInterval(() => {
            if (isPaused) return;
            container.scrollTop += step;
            if (container.scrollTop >= maxScroll - 1) {
              clearInterval(scrollInterval);
              setTimeout(nextView, 3000);
            }
          }, 30);
        } else {
          setTimeout(nextView, 8000);
        }
      }, 3000);
    }

    function nextView() {
      currentIdx = (currentIdx + 1) % views.length;
      lancerCycle();
    }

    function afficherDonnees(vue) {
      document.getElementById('currentCat').textContent = `${vue.d} ${vue.c}`;
      const tbody = document.getElementById('resultsTable');
      
      const filtered = allShooters
        .filter(s => s.discipline === vue.d && (s.category || '') === vue.c)
        .sort((a,b) => (Number(b.score)||0) - (Number(a.score)||0));

      tbody.innerHTML = filtered.map((s, i) => {
        let medal = i === 0 ? "medal-1" : i === 1 ? "medal-2" : i === 2 ? "medal-3" : "";
        return `<tr class="${medal}">
          <td class="rank-cell">${i+1}</td>
          <td><b>${s.lastName}</b> ${s.firstName}</td>
          <td>${s.club || ''}</td>
          <td class="score-cell">${s.score} <small style="opacity:0.5">/${s.maxScore}</small></td>
        </tr>`;
      }).join('');
      
      const next = views[(currentIdx + 1) % views.length];
      document.getElementById('rotateIndicator').textContent = next ? `↻ PROCHAIN : ${next.d} ${next.c}` : "";
    }

    setInterval(() => { document.getElementById('headerClock').textContent = new Date().toLocaleTimeString(); }, 1000);

    document.addEventListener('keydown', e => {
      if(e.code === 'Space') { 
        isPaused = !isPaused; 
        document.getElementById('rotateIndicator').textContent = isPaused ? "⏸ PAUSE" : "↻ REPRISE...";
      }
    });
  </script>
</body>
</html>
