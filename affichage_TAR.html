<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>🎯 Résultats Provisoires - TAR</title>

  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
  
  <style>
    body {
      font-family:'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #0f2027 0%, #203a43 50%, #2c5364 100%);
      color:#fff;
      margin:0;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .header {
      padding:15px 30px;
      background: rgba(0,0,0,0.5);
      backdrop-filter: blur(10px);
      border-bottom: 2px solid #4f7cff;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    /* CONTENEUR DE LA LISTE */
    #main-container {
      flex: 1;
      overflow-y: auto; /* Zone de défilement */
      padding: 0 20px 20px 20px;
      position: relative;
    }
    #main-container::-webkit-scrollbar { display: none; }

    /* TITRE DISCIPLINE / CATEGORIE FIGÉ */
    .cat-header {
      position: sticky;
      top: 0;
      z-index: 100;
      background: linear-gradient(135deg, #4f7cff 0%, #7c3aed 100%);
      padding: 15px;
      text-align: center;
      border-radius: 0 0 15px 15px;
      box-shadow: 0 5px 15px rgba(0,0,0,0.3);
      margin-bottom: 10px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 1.4em;
    }

    /* TITRES DES COLONNES FIGÉS SOUS LA DISCIPLINE */
    thead th {
      position: sticky;
      top: 70px; /* Ajusté pour se coller sous .cat-header */
      z-index: 99;
      background: #1c3d49;
      padding: 15px;
      text-align: left;
      text-transform: uppercase;
      border-bottom: 2px solid #4f7cff;
    }

    tr { border-bottom: 1px solid rgba(255,255,255,0.1); }
    td { padding: 18px 15px; }

    /* PODIUM */
    .medal-1 { background: linear-gradient(90deg, #ffd700cc 0%, #ffef94cc 100%) !important; color: #222 !important; }
    .medal-2 { background: linear-gradient(90deg, #c0c0c0cc 0%, #e8e8e8cc 100%) !important; color: #222 !important; }
    .medal-3 { background: linear-gradient(90deg, #cd7f32cc 0%, #ffb36bcc 100%) !important; color: #fff !important; }

    .score-cell { font-weight: 900; text-align: right; color: #18d9a0; }
    .medal-1 .score-cell, .medal-2 .score-cell { color: #222 !important; }

    .footer {
      position: fixed;
      bottom: 0; width: 100%;
      background: rgba(0,0,0,0.8);
      padding: 10px 30px;
      display: flex;
      justify-content: space-between;
      font-size: 0.9em;
      border-top: 1px solid #4f7cff;
    }
  </style>
</head>
<body>

  <div class="header">
    <h1 id="compName" style="margin:0; font-size: 1.5em;">CHARGEMENT...</h1>
    <div id="headerClock" style="font-size: 1.5em; font-weight: bold;">00:00:00</div>
  </div>

  <div id="main-container">
    <div class="cat-header">
      <h2 id="currentCat" style="margin:0;">Discipline - Catégorie</h2>
    </div>

    <table>
      <thead>
        <tr>
          <th style="width:80px">Rang</th>
          <th>Tireur</th>
          <th>Club</th>
          <th style="text-align:right">Score</th>
        </tr>
      </thead>
      <tbody id="resultsTable">
        </tbody>
    </table>
  </div>

  <div class="footer">
    <div id="rotateIndicator">Initialisation...</div>
    <div>Ligue LR - Système de Tir</div>
  </div>

  <script>
    // Config Firebase (Inchangée)
    const firebaseConfig = {
      apiKey: "AIzaSyAvfMRtRrhh_e-27xHlwIx9c5DIdUQm6HM",
      authDomain: "resultats-tir-ligue-lr.firebaseapp.com",
      databaseURL: "https://resultats-tir-ligue-lr-default-rtdb.europe-west1.firebasedatabase.app",
      projectId: "resultats-tir-ligue-lr",
      storageBucket: "resultats-tir-ligue-lr.firebasestorage.app",
      appId: "1:468808300974:web:563a14cc4477c10b28303f"
    };

    firebase.initializeApp(firebaseConfig);
    const database = firebase.database();
    const urlParams = new URLSearchParams(window.location.search);
    const compCode = urlParams.get('comp') || 'GENERAL';

    let views = [];
    let currentIdx = 0;
    let isPaused = false;
    let scrollInterval;

    database.ref(`${compCode}/config/name`).on('value', s => {
      document.getElementById('compName').textContent = s.val() || compCode;
    });

    database.ref(`${compCode}/shooters`).on('value', snapshot => {
      const data = snapshot.val();
      if (!data) return;
      
      const shooters = Object.values(data);
      const groups = {};
      shooters.forEach(s => {
        const k = s.discipline + \"|\" + s.category;
        if (!groups[k]) groups[k] = [];
        groups[k].push(s);
      });

      views = Object.keys(groups).sort().map(k => {
        return {
          d: k.split('|')[0],
          c: k.split('|')[1],
          list: groups[k].sort((a,b) => b.score - a.score)
        };
      });

      startRotation();
    });

    async function startRotation() {
      if (views.length === 0) return;
      renderView();
      
      const container = document.getElementById('main-container');
      container.scrollTop = 0;
      clearInterval(scrollInterval);

      setTimeout(() => {
        if (isPaused) return;
        const maxScroll = container.scrollHeight - container.clientHeight;
        
        if (maxScroll > 10) {
          // On fait défiler sur 10 secondes
          const duration = 10000; 
          const step = maxScroll / (duration / 30);
          
          scrollInterval = setInterval(() => {
            if (isPaused) return;
            container.scrollTop += step;
            if (container.scrollTop >= maxScroll - 1) {
              clearInterval(scrollInterval);
              setTimeout(nextView, 2500);
            }
          }, 30);
        } else {
          setTimeout(nextView, 6000);
        }
      }, 2500);
    }

    function nextView() {
      currentIdx = (currentIdx + 1) % views.length;
      startRotation();
    }

    function renderView() {
      const v = views[currentIdx];
      document.getElementById('currentCat').textContent = `${v.d} - ${v.c}`;
      
      const tbody = document.getElementById('resultsTable');
      tbody.innerHTML = v.list.map((s, i) => {
        let m = i === 0 ? "medal-1" : i === 1 ? "medal-2" : i === 2 ? "medal-3" : "";
        return `<tr class=\"${m}\">
          <td style=\"text-align:center\"><b>${i+1}</b></td>
          <td><b>${s.lastName}</b> ${s.firstName}</td>
          <td>${s.club || ''}</td>
          <td class=\"score-cell\">${s.score}</td>
        </tr>`;
      }).join('');
      
      const next = views[(currentIdx + 1) % views.length];
      document.getElementById('rotateIndicator').textContent = `↻ PROCHAIN : ${next.d} - ${next.c}`;
    }

    setInterval(() => { document.getElementById('headerClock').textContent = new Date().toLocaleTimeString(); }, 1000);
  </script>
</body>
</html>
