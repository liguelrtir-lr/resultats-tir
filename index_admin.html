<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>🎯 Ligue LR — Admin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;500;600;700&family=Barlow:wght@300;400;500&family=Barlow+Condensed:wght@400;600;700&display=swap" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-database-compat.js"></script>

  <style>
    :root {
      --sidebar-bg: #2a1628;
      --sidebar-border: #3d1f3d;
      --sidebar-accent: #e879b0;
      --sidebar-muted: rgba(232,121,176,0.5);
      --bg: #f4f6fb;
      --surface: #ffffff;
      --surface2: #f8fafc;
      --border: #e8edf5;
      --text: #0f1923;
      --text-muted: #64748b;
      --text-dim: #a0aec0;
      --green: #10b981; --green-bg: #ecfdf5;
      --purple: #8b5cf6; --purple-bg: #f5f3ff;
      --blue: #0ea5e9; --blue-bg: #f0f9ff;
      --red: #ef4444;
      --accent: #be185d;
      --radius: 8px;
      --radius-lg: 16px;
      --radius-xl: 22px;
    }
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Barlow', sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      min-height: 100vh;
    }

    /* ═══ SIDEBAR ═══ */
    .sidebar {
      width: 270px;
      background: var(--sidebar-bg);
      padding: 32px 20px;
      display: flex;
      flex-direction: column;
      position: fixed;
      height: 100vh;
      z-index: 100;
      border-right: 1px solid var(--sidebar-border);
    }

    .logo-area {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      margin-bottom: 36px;
      padding-bottom: 28px;
      border-bottom: 1px solid rgba(255,255,255,0.07);
    }
    .logo-area img {
      width: 90px;
      height: 90px;
      object-fit: contain;
      border-radius: 50%;
      border: 2px solid rgba(232,121,176,0.25);
      background: rgba(255,255,255,0.05);
    }
    .logo-name {
      font-family: 'Rajdhani', sans-serif;
      font-size: 1.35rem;
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: #ffffff;
      display: flex;
      align-items: center;
      gap: 7px;
    }
    .logo-name span { color: var(--sidebar-accent); }

    .btn-create {
      background: var(--sidebar-accent);
      color: white;
      padding: 13px 16px;
      border: none;
      border-radius: var(--radius-lg);
      font-family: 'Rajdhani', sans-serif;
      font-weight: 700;
      font-size: 1rem;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      cursor: pointer;
      transition: all 0.2s;
      box-shadow: 0 4px 20px rgba(232,121,176,0.3);
      width: 100%;
    }
    .btn-create:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 28px rgba(232,121,176,0.45);
      background: #f472b6;
    }

    .sidebar-footer {
      margin-top: auto;
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 0.72rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--sidebar-muted);
      opacity: 0.7;
    }

    /* ═══ MAIN ═══ */
    .main-content {
      flex: 1;
      margin-left: 270px;
      padding: 48px 52px;
    }

    .header-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 40px;
    }
    .page-title {
      font-family: 'Rajdhani', sans-serif;
      font-weight: 700;
      font-size: 1.9rem;
      letter-spacing: 0.03em;
      color: var(--text);
    }
    .clock {
      font-family: 'Rajdhani', sans-serif;
      font-size: 1.4rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      color: var(--accent);
      background: #fdf2f8;
      border: 1px solid #fbcfe8;
      padding: 6px 16px;
      border-radius: 20px;
    }

    /* ═══ GRID ═══ */
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(330px, 1fr));
      gap: 24px;
    }

    /* ═══ CARD ═══ */
    .card {
      background: var(--surface);
      border-radius: var(--radius-xl);
      padding: 26px;
      border: 1px solid var(--border);
      box-shadow: 0 2px 8px rgba(0,0,0,0.03);
      transition: all 0.25s ease;
      display: flex;
      flex-direction: column;
      position: relative;
      overflow: hidden;
    }
    .card::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 3px;
      background: linear-gradient(90deg, var(--sidebar-accent), transparent);
      opacity: 0;
      transition: opacity 0.25s;
    }
    .card:hover {
      transform: translateY(-5px);
      box-shadow: 0 16px 40px rgba(74,44,64,0.1);
      border-color: #fce7f3;
    }
    .card:hover::before { opacity: 1; }

    .type-tag {
      display: inline-block;
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 0.68rem;
      font-weight: 700;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      padding: 4px 10px;
      border-radius: 6px;
      background: #fdf2f8;
      color: var(--accent);
      border: 1px solid #fbcfe8;
      margin-bottom: 14px;
      width: fit-content;
    }

    .card-title {
      font-family: 'Rajdhani', sans-serif;
      font-weight: 700;
      font-size: 1.35rem;
      letter-spacing: 0.03em;
      color: var(--text);
      margin-bottom: 5px;
      text-transform: uppercase;
    }
    .card-code {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 0.8rem;
      letter-spacing: 0.08em;
      color: var(--text-dim);
      margin-bottom: 22px;
    }

    .stat-pill {
      background: var(--surface2);
      border: 1px solid var(--border);
      padding: 12px 16px;
      border-radius: var(--radius-lg);
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }
    .stat-label {
      font-size: 0.85rem;
      color: var(--text-muted);
      font-weight: 500;
    }
    .stat-val {
      font-family: 'Rajdhani', sans-serif;
      font-size: 1.5rem;
      font-weight: 700;
      color: var(--accent);
    }

    /* ═══ ACTION BUTTONS ═══ */
    .actions-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }
    .btn-act {
      padding: 12px;
      border-radius: var(--radius-lg);
      border: none;
      font-family: 'Rajdhani', sans-serif;
      font-weight: 700;
      font-size: 0.88rem;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      cursor: pointer;
      text-align: center;
      text-decoration: none;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: all 0.18s;
    }
    .btn-saisie { background: var(--green-bg); color: var(--green); border: 1px solid #a7f3d0; }
    .btn-saisie:hover { background: var(--green); color: white; border-color: var(--green); }

    .btn-qr { background: var(--purple-bg); color: var(--purple); border: 1px solid #ddd6fe; }
    .btn-qr:hover { background: var(--purple); color: white; border-color: var(--purple); }

    .btn-tv {
      grid-column: span 2;
      background: var(--blue-bg);
      color: var(--blue);
      border: 1px solid #bae6fd;
    }
    .btn-tv:hover { background: var(--blue); color: white; border-color: var(--blue); }

    .btn-del {
      grid-column: span 2;
      background: none;
      border: 1px solid var(--border);
      color: var(--text-dim);
      font-size: 0.75rem;
      margin-top: 4px;
      padding: 9px;
      border-radius: var(--radius);
    }
    .btn-del:hover { color: var(--red); border-color: #fecaca; background: #fef2f2; }

    /* ═══ MODALS ═══ */
    .modal {
      position: fixed; inset: 0;
      background: rgba(42,22,40,0.45);
      backdrop-filter: blur(6px);
      display: none; align-items: center; justify-content: center;
      z-index: 1000;
    }
    .modal.active { display: flex; }

    .modal-content {
      background: white;
      padding: 36px;
      border-radius: var(--radius-xl);
      width: 90%;
      max-width: 440px;
      box-shadow: 0 24px 60px rgba(0,0,0,0.15);
    }
    .modal-title {
      font-family: 'Rajdhani', sans-serif;
      font-weight: 700;
      font-size: 1.4rem;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: var(--text);
      margin-bottom: 24px;
      padding-bottom: 16px;
      border-bottom: 1px solid var(--border);
    }
    .modal-content input,
    .modal-content select {
      width: 100%;
      padding: 12px 14px;
      margin-bottom: 14px;
      border-radius: var(--radius);
      border: 1px solid var(--border);
      font-family: 'Barlow', sans-serif;
      font-size: 0.95rem;
      color: var(--text);
      background: var(--surface2);
      outline: none;
      transition: border-color 0.2s;
    }
    .modal-content input:focus,
    .modal-content select:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(190,24,93,0.08);
    }
    .modal-actions { display: flex; gap: 10px; margin-top: 6px; }
    .btn-modal-cancel {
      flex: 1; padding: 12px; border-radius: var(--radius);
      border: 1px solid var(--border); background: var(--surface2);
      font-family: 'Rajdhani', sans-serif; font-weight: 700;
      font-size: 0.95rem; text-transform: uppercase; letter-spacing: 0.05em;
      cursor: pointer; color: var(--text-muted); transition: all 0.18s;
    }
    .btn-modal-cancel:hover { background: var(--border); }
    .btn-modal-confirm {
      flex: 1; padding: 12px; border-radius: var(--radius);
      border: none; background: var(--sidebar-bg);
      font-family: 'Rajdhani', sans-serif; font-weight: 700;
      font-size: 0.95rem; text-transform: uppercase; letter-spacing: 0.05em;
      cursor: pointer; color: white; transition: all 0.18s;
    }
    .btn-modal-confirm:hover { background: #3d1f3d; }

    /* QR modal */
    .qr-url {
      font-size: 0.72rem;
      color: var(--text-muted);
      word-break: break-all;
      margin: 14px 0;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 10px 12px;
    }

    /* EMPTY STATE */
    .empty-state {
      grid-column: 1 / -1;
      text-align: center;
      padding: 80px 24px;
      color: var(--text-dim);
    }
    .empty-state .icon { font-size: 3rem; margin-bottom: 16px; opacity: 0.4; }
    .empty-state p { font-size: 1rem; }
  </style>
</head>
<body>

  <aside class="sidebar">
    <div class="logo-area">
      <img src="logo.png"
           onerror="this.style.display='none'" alt="Logo Ligue LR">
      <div class="logo-name">🎯 <span>Ligue</span> LR</div>
    </div>
    <button class="btn-create" onclick="openCreateModal()">+ Nouveau Championnat</button>
    <div class="sidebar-footer" style="margin-top: auto;">Admin v4.2 — Rose Sombre</div>
  </aside>

  <main class="main-content">
    <div class="header-row">
      <div class="page-title">Tableau de bord</div>
      <div class="clock" id="clock">00:00:00</div>
    </div>
    <div class="grid" id="compGrid"></div>
  </main>

  <!-- MODAL CRÉATION -->
  <div class="modal" id="createModal">
    <div class="modal-content">
      <div class="modal-title">⚙️ Nouveau Championnat</div>
      <input type="text" id="newCompName" placeholder="Nom du Championnat">
      <input type="text" id="newCompCode" placeholder="Code (ex: TAR_2026)">
      <select id="newCompType">
        <option value="ISSF10">ISSF 10 Mètres</option>
        <option value="EDT">École de Tir (EDT)</option>
        <option value="MLAIC">Armes Anciennes (MLAIC)</option>
        <option value="TAR">TAR (Armes Réglementaires)</option>
        <option value="2550">ISSF 25/50 Mètres</option>
        <option value="AMICAL">Concours Amical</option>
      </select>
      <div class="modal-actions">
        <button class="btn-modal-cancel" onclick="closeCreateModal()">Annuler</button>
        <button class="btn-modal-confirm" onclick="createComp()">Créer</button>
      </div>
    </div>
  </div>

  <!-- MODAL QR -->
  <div class="modal" id="qrModal">
    <div class="modal-content" style="text-align:center">
      <div class="modal-title" id="qrTitle">Accès Live</div>
      <div id="qrcode" style="display:inline-block; border: 6px solid #fdf2f8; border-radius: 12px;"></div>
      <div class="qr-url" id="qrUrl"></div>
      <button class="btn-modal-cancel" style="width:100%;" onclick="closeQrModal()">Fermer</button>
    </div>
  </div>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyAvfMRtRrhh_e-27xHlwIx9c5DIdUQm6HM",
      authDomain: "resultats-tir-ligue-lr.firebaseapp.com",
      databaseURL: "https://resultats-tir-ligue-lr-default-rtdb.europe-west1.firebasedatabase.app",
      projectId: "resultats-tir-ligue-lr",
      storageBucket: "resultats-tir-ligue-lr.firebasestorage.app",
      appId: "1:468808300974:web:563a14cc4477c10b28303f"
    };

    firebase.initializeApp(firebaseConfig);
    const database = firebase.database();
    const GITHUB_BASE = "https://liguelrtir-lr.github.io/resultats-tir";

    function openCreateModal() { document.getElementById('createModal').classList.add('active'); }
    function closeCreateModal() { document.getElementById('createModal').classList.remove('active'); }

    function createComp() {
      const name = document.getElementById('newCompName').value.trim();
      const code = document.getElementById('newCompCode').value.trim().toUpperCase().replace(/\s/g, '_');
      const type = document.getElementById('newCompType').value;
      if (!name || !code) return alert("Remplis tout !");
      database.ref(code + '/config').set({ name, type }).then(() => {
        closeCreateModal();
        document.getElementById('newCompName').value = '';
        document.getElementById('newCompCode').value = '';
      });
    }

    function deleteComp(code, name) {
      if (confirm(`Supprimer définitivement "${name}" ?`)) database.ref(code).remove();
    }

    function openQr(code) {
      const url = `${GITHUB_BASE}/affichage_multicomp.html?comp=${code}`;
      document.getElementById('qrTitle').textContent = '📱 ' + code;
      document.getElementById('qrUrl').textContent = url;
      const qrContainer = document.getElementById('qrcode');
      qrContainer.innerHTML = '';
      new QRCode(qrContainer, { text: url, width: 200, height: 200 });
      document.getElementById('qrModal').classList.add('active');
    }

    function closeQrModal() { document.getElementById('qrModal').classList.remove('active'); }

    database.ref().on('value', snap => {
      const grid = document.getElementById('compGrid');
      grid.innerHTML = '';
      const data = snap.val();
      if (!data) {
        grid.innerHTML = `<div class="empty-state"><div class="icon">🎯</div><p>Aucun championnat créé pour l'instant.</p></div>`;
        return;
      }

      let hasCards = false;
      Object.keys(data).sort().forEach(code => {
        const config = data[code].config;
        if (config && config.name) {
          hasCards = true;
          const shooterCount = data[code].shooters ? Object.keys(data[code].shooters).length : 0;
          const card = document.createElement('div');
          card.className = 'card';
          card.innerHTML = `
            <div class="type-tag">${config.type || 'MULTI'}</div>
            <div class="card-title">${config.name}</div>
            <div class="card-code">#${code}</div>
            <div class="stat-pill">
              <span class="stat-label">Tireurs inscrits</span>
              <span class="stat-val">${shooterCount}</span>
            </div>
            <div class="actions-grid">
              <a href="saisie_multicomp.html?comp=${code}" class="btn-act btn-saisie">⌨️ Saisie</a>
              <button onclick="openQr('${code}')" class="btn-act btn-qr">📱 QR Code</button>
              <a href="affichage_multicomp.html?comp=${code}" target="_blank" class="btn-act btn-tv">📺 Affichage Live</a>
              <button onclick="deleteComp('${code}', '${config.name.replace(/'/g,"\\'")}'')" class="btn-act btn-del">🗑️ Supprimer</button>
            </div>
          `;
          grid.appendChild(card);
        }
      });

      if (!hasCards) {
        grid.innerHTML = `<div class="empty-state"><div class="icon">🎯</div><p>Aucun championnat créé pour l'instant.</p></div>`;
      }
    });

    setInterval(() => {
      document.getElementById('clock').textContent = new Date().toLocaleTimeString('fr-FR');
    }, 1000);
  </script>
</body>
</html>
