<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>🎯 Ligue LR - Administration</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=JetBrains+Mono:wght@700&display=swap" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-database-compat.js"></script>

  <style>
    :root {
      --bg: #f0f4f8; /* Fond gris bleuté très clair, pro et reposant */
      --sidebar: #1a2b3c; /* Bleu ardoise foncé pour le sérieux */
      --accent: #2563eb; /* Bleu royal pour l'action principale */
      --accent-hover: #1d4ed8;
      --card-bg: #ffffff;
      --text-main: #1e293b;
      --text-muted: #64748b;
      --danger: #dc2626;
      --success: #16a34a;
    }

    * { margin:0; padding:0; box-sizing:border-box; }

    body {
      background: var(--bg);
      color: var(--text-main);
      font-family: 'Inter', sans-serif;
      display: flex;
      min-height: 100vh;
    }

    /* --- MENU LATÉRAL --- */
    .sidebar {
      width: 280px;
      background: var(--sidebar);
      color: white;
      padding: 30px 20px;
      display: flex;
      flex-direction: column;
      position: fixed;
      height: 100vh;
    }

    .logo-area {
      font-weight: 800;
      font-size: 1.5em;
      margin-bottom: 40px;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .btn-nav-main {
      background: var(--accent);
      color: white;
      padding: 15px;
      border: none;
      border-radius: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: 0.2s;
      text-align: center;
      margin-bottom: 20px;
    }

    .btn-nav-main:hover { background: var(--accent-hover); transform: translateY(-2px); }

    /* --- ZONE PRINCIPALE --- */
    .main-content {
      flex: 1;
      margin-left: 280px;
      padding: 40px 60px;
    }

    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 40px;
    }

    .section-title { font-weight: 800; font-size: 1.8em; letter-spacing: -0.5px; }

    /* --- GRILLE DE CARTES ÉPURÉES --- */
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 25px;
    }

    .card {
      background: var(--card-bg);
      border-radius: 20px;
      padding: 25px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
      transition: 0.3s;
      border: 1px solid transparent;
      display: flex;
      flex-direction: column;
    }

    .card:hover {
      transform: translateY(-5px);
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1);
      border-color: var(--accent);
    }

    .card-badge {
      font-size: 0.7em;
      font-weight: 700;
      padding: 4px 10px;
      border-radius: 6px;
      text-transform: uppercase;
      background: #e2e8f0;
      color: #475569;
      width: fit-content;
      margin-bottom: 12px;
    }

    .card-title { font-weight: 700; font-size: 1.25em; margin-bottom: 8px; color: var(--sidebar); }
    .card-code { font-family: 'JetBrains Mono', monospace; font-size: 0.8em; color: var(--text-muted); margin-bottom: 20px; }

    .card-stat-box {
      background: #f8fafc;
      border-radius: 12px;
      padding: 15px;
      margin-bottom: 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .stat-label { font-size: 0.85em; font-weight: 600; color: var(--text-muted); }
    .stat-number { font-size: 1.4em; font-weight: 800; color: var(--accent); }

    /* --- BOUTONS D'ACTION CLAIRS --- */
    .actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .btn-action {
      padding: 12px;
      border-radius: 10px;
      border: 1px solid #e2e8f0;
      background: white;
      color: var(--text-main);
      font-weight: 600;
      font-size: 0.85em;
      cursor: pointer;
      transition: 0.2s;
      text-decoration: none;
      text-align: center;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .btn-action:hover { background: #f1f5f9; border-color: var(--accent); color: var(--accent); }
    .btn-action.primary { background: var(--sidebar); color: white; border: none; }
    .btn-action.primary:hover { background: #2c3e50; color: white; }

    .btn-delete {
      grid-column: span 2;
      margin-top: 10px;
      color: var(--danger);
      font-size: 0.8em;
      border: none;
      background: none;
      opacity: 0.6;
    }
    .btn-delete:hover { opacity: 1; text-decoration: underline; }

    /* --- MODAL --- */
    .modal {
      position: fixed; inset: 0; background: rgba(15, 23, 42, 0.5);
      backdrop-filter: blur(4px); display: none; align-items: center; justify-content: center; z-index: 1000;
    }
    .modal.active { display: flex; }
    .modal-content {
      background: white; padding: 40px; border-radius: 24px; width: 90%; max-width: 450px;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
    }

    input, select {
      width: 100%; padding: 14px; margin-bottom: 20px; border-radius: 10px; border: 1px solid #cbd5e1;
      font-family: inherit; font-size: 1em;
    }
    input:focus { border-color: var(--accent); outline: none; box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1); }

    #qrcode { background: white; padding: 15px; border-radius: 12px; border: 1px solid #e2e8f0; display: inline-block; }
  </style>
</head>
<body>

  <aside class="sidebar">
    <div class="logo-area">🎯 Ligue LR</div>
    <button class="btn-nav-main" onclick="openCreateModal()">+ Nouveau Championnat</button>
    <div style="margin-top: auto; font-size: 0.8em; color: #94a3b8;">Saison 2026 — v3.0</div>
  </aside>

  <main class="main-content">
    <div class="top-bar">
      <div class="section-title">Tableau de bord</div>
      <div id="clock" style="font-family: 'JetBrains Mono'; font-weight: 700; color: var(--text-muted);">00:00:00</div>
    </div>

    <div class="grid" id="compGrid"></div>
  </main>

  <div class="modal" id="createModal">
    <div class="modal-content">
      <h2 style="margin-bottom:25px; font-weight: 800;">Configuration</h2>
      <input type="text" id="newCompName" placeholder="Nom (ex: Championnat TAR)">
      <input type="text" id="newCompCode" placeholder="Code unique (ex: TAR_2024)">
      
      <select id="newCompType">
        <option value="ISSF10">ISSF 10 Mètres</option>
        <option value="EDT">École de Tir (EDT)</option>
        <option value="MLAIC">Armes Anciennes (MLAIC)</option>
        <option value="TAR">TAR (Armes Réglementaires)</option>
        <option value="2550">ISSF 25/50 Mètres</option>
        <option value="AMICAL">Amical / Multi</option>
      </select>

      <div style="display:flex; gap:12px">
        <button class="btn-action" style="flex:1" onclick="closeCreateModal()">Annuler</button>
        <button class="btn-action primary" style="flex:1" onclick="createComp()">Créer</button>
      </div>
    </div>
  </div>

  <div class="modal" id="qrModal">
    <div class="modal-content" style="text-align:center">
      <h2 id="qrTitle" style="margin-bottom:20px">Lien de partage</h2>
      <div id="qrcode"></div>
      <p id="qrUrl" style="font-size:0.75em; color:var(--text-muted); word-break:break-all; margin: 20px 0;"></p>
      <button class="btn-action" style="width:100%" onclick="closeQrModal()">Fermer</button>
    </div>
  </div>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyAvfMRtRrhh_e-27xHlwIx9c5DIdUQm6HM",
      authDomain: "resultats-tir-ligue-lr.firebaseapp.com",
      databaseURL: "https://resultats-tir-ligue-lr-default-rtdb.europe-west1.firebasedatabase.app",
      projectId: "resultats-tir-ligue-lr",
      storageBucket: "resultats-tir-ligue-lr.firebasestorage.app",
      appId: "1:468808300974:web:563a14cc4477c10b28303f"
    };

    firebase.initializeApp(firebaseConfig);
    const database = firebase.database();
    const GITHUB_BASE = "https://liguelrtir-lr.github.io/resultats-tir";

    function openCreateModal() { document.getElementById('createModal').classList.add('active'); }
    function closeCreateModal() { document.getElementById('createModal').classList.remove('active'); }

    function createComp() {
      const name = document.getElementById('newCompName').value.trim();
      const code = document.getElementById('newCompCode').value.trim().toUpperCase().replace(/\s/g, '_');
      const type = document.getElementById('newCompType').value;
      if (!name || !code) return alert("Champs requis");
      database.ref(code + '/config').set({ name: name, type: type }).then(() => closeCreateModal());
    }

    function deleteComp(code, name) {
      if (confirm(`⚠️ Supprimer définitivement "${name}" ?`)) database.ref(code).remove();
    }

    function openQr(code) {
      const url = `${GITHUB_BASE}/affichage_multicomp.html?comp=${code}`;
      document.getElementById('qrTitle').textContent = code;
      document.getElementById('qrUrl').textContent = url;
      const qrContainer = document.getElementById('qrcode');
      qrContainer.innerHTML = '';
      new QRCode(qrContainer, { text: url, width: 200, height: 200 });
      document.getElementById('qrModal').classList.add('active');
    }

    function closeQrModal() { document.getElementById('qrModal').classList.remove('active'); }

    database.ref().on('value', snap => {
      const grid = document.getElementById('compGrid');
      grid.innerHTML = '';
      const data = snap.val();
      if (!data) return;

      Object.keys(data).forEach(code => {
        const config = data[code].config;
        if (config && config.name) {
          const shooterCount = data[code].shooters ? Object.keys(data[code].shooters).length : 0;
          const card = document.createElement('div');
          card.className = 'card';
          card.innerHTML = `
            <div class="card-badge">${config.type || 'MULTI'}</div>
            <div class="card-title">${config.name}</div>
            <div class="card-code">#${code}</div>
            <div class="card-stat-box">
               <span class="stat-label">Tireurs enregistrés</span>
               <span class="stat-number">${shooterCount}</span>
            </div>
            <div class="actions">
              <a href="saisie_multicomp.html?comp=${code}" class="btn-action primary">Saisie</a>
              <button onclick="openQr('${code}')" class="btn-action">QR Code</button>
              <a href="affichage_multicomp.html?comp=${code}" target="_blank" class="btn-action" style="grid-column: span 2">Voir l'affichage TV</a>
              <button onclick="deleteComp('${code}', '${config.name}')" class="btn-delete">Supprimer du serveur</button>
            </div>
          `;
          grid.appendChild(card);
        }
      });
    });

    setInterval(() => { document.getElementById('clock').textContent = new Date().toLocaleTimeString(); }, 1000);
  </script>
</body>
</html>
