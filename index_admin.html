<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>🎯 Ligue LR - Admin Rose & Pastel</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&family=JetBrains+Mono:wght@700&display=swap" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-database-compat.js"></script>

  <style>
    :root {
      --bg-pastel: #f8fafc; 
      /* NOUVELLE COULEUR ROSE SOMBRE POUR LA SIDEBAR */
      --sidebar-bg: #4a2c40; /* Rose sombre / Lie de vin */
      --sidebar-text: #ffffff;
      
      --text-dark: #0f172a;
      --text-light: #64748b;
      
      /* Palette de boutons colorés */
      --btn-saisie: #10b981; 
      --btn-qr: #8b5cf6;     
      --btn-tv: #0ea5e9;     
      --btn-add: #ff7eb3;    /* Rose plus vif pour le bouton Ajouter */
      --danger: #ef4444;     
    }

    * { margin:0; padding:0; box-sizing:border-box; }

    body {
      background: var(--bg-pastel);
      background-image: radial-gradient(at 0% 0%, rgba(74, 44, 64, 0.03) 0px, transparent 50%);
      color: var(--text-dark);
      font-family: 'Plus Jakarta Sans', sans-serif;
      display: flex;
      min-height: 100vh;
    }

    /* --- SIDEBAR ROSE SOMBRE --- */
    .sidebar {
      width: 280px;
      background: var(--sidebar-bg);
      padding: 40px 24px;
      display: flex;
      flex-direction: column;
      position: fixed;
      height: 100vh;
      box-shadow: 10px 0 30px rgba(0,0,0,0.1);
      z-index: 100;
    }

    .logo-area {
      font-weight: 800;
      font-size: 1.6em;
      margin-bottom: 40px;
      color: #ffb8d9; /* Rose clair pour le texte sur fond sombre */
      letter-spacing: -1px;
    }

    .btn-create {
      background: var(--btn-add);
      color: white;
      padding: 16px;
      border: none;
      border-radius: 16px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.3s;
      box-shadow: 0 10px 15px -3px rgba(255, 126, 179, 0.3);
    }

    .btn-create:hover { transform: translateY(-2px); box-shadow: 0 20px 25px -5px rgba(255, 126, 179, 0.4); }

    /* --- CONTENU --- */
    .main-content { flex: 1; margin-left: 280px; padding: 60px; }
    .header-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 40px; }
    .page-title { font-weight: 800; font-size: 2em; color: var(--sidebar-bg); }

    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); gap: 30px; }

    .card {
      background: white;
      border-radius: 24px;
      padding: 30px;
      border: 1px solid #edf2f7;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.02);
      transition: all 0.4s ease;
      display: flex;
      flex-direction: column;
    }
    .card:hover { transform: translateY(-8px); box-shadow: 0 25px 50px -12px rgba(74, 44, 64, 0.1); }

    .type-tag {
      font-size: 0.65em; font-weight: 800; padding: 6px 12px; border-radius: 10px;
      background: #fdf2f8; color: #be185d; text-transform: uppercase; margin-bottom: 15px; width: fit-content;
    }

    .card-title { font-weight: 800; font-size: 1.4em; color: #0f172a; margin-bottom: 10px; }
    .card-code { font-family: 'JetBrains Mono'; font-size: 0.8em; color: var(--text-light); margin-bottom: 25px; }

    .stat-pill {
      background: #fafafa; padding: 15px; border-radius: 18px;
      display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px;
    }
    .stat-val { font-size: 1.4em; font-weight: 800; color: #be185d; }

    /* --- BOUTONS ACTIONS --- */
    .actions-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .btn-act { padding: 14px; border-radius: 14px; border: none; font-weight: 700; font-size: 0.85em; cursor: pointer; text-align: center; text-decoration: none; transition: 0.2s; }

    .btn-saisie { background: #ecfdf5; color: var(--btn-saisie); }
    .btn-saisie:hover { background: var(--btn-saisie); color: white; }

    .btn-qr { background: #f5f3ff; color: var(--btn-qr); }
    .btn-qr:hover { background: var(--btn-qr); color: white; }

    .btn-tv { background: #f0f9ff; color: var(--btn-tv); grid-column: span 2; border: 2px solid #e0f2fe; }
    .btn-tv:hover { background: var(--btn-tv); color: white; }

    .btn-del { grid-column: span 2; background: none; color: #cbd5e1; font-size: 0.75em; margin-top: 10px; cursor:pointer; }
    .btn-del:hover { color: var(--danger); }

    /* MODAL */
    .modal { position: fixed; inset: 0; background: rgba(74, 44, 64, 0.3); backdrop-filter: blur(8px); display: none; align-items: center; justify-content: center; z-index: 1000; }
    .modal.active { display: flex; }
    .modal-content { background: white; padding: 40px; border-radius: 30px; width: 90%; max-width: 450px; }
    input, select { width: 100%; padding: 15px; margin-bottom: 20px; border-radius: 12px; border: 2px solid #f1f5f9; font-family: inherit; }
  </style>
</head>
<body>

  <aside class="sidebar">
    <div class="logo-area">🎯 Ligue LR</div>
    <button class="btn-create" onclick="openCreateModal()">+ Nouveau Championnat</button>
    <div style="margin-top: auto; font-size: 0.8em; color: #ffb8d9; opacity: 0.6;">Admin v4.1 — Rose Sombre</div>
  </aside>

  <main class="main-content">
    <div class="header-row">
      <div class="page-title">Tableau de bord</div>
      <div id="clock" style="font-weight: 700; color: #be185d;">00:00:00</div>
    </div>
    <div class="grid" id="compGrid"></div>
  </main>

  <div class="modal" id="createModal">
    <div class="modal-content">
      <h2 style="margin-bottom:25px; font-weight: 800;">Configuration</h2>
      <input type="text" id="newCompName" placeholder="Nom du Championnat">
      <input type="text" id="newCompCode" placeholder="Code (ex: TAR_2026)">
      <select id="newCompType">
        <option value="ISSF10">ISSF 10 Mètres</option>
        <option value="EDT">École de Tir (EDT)</option>
        <option value="MLAIC">Armes Anciennes (MLAIC)</option>
        <option value="TAR">TAR (Armes Réglementaires)</option>
        <option value="2550">ISSF 25/50 Mètres</option>
        <option value="AMICAL">Concours Amical</option>
      </select>
      <div style="display:flex; gap:12px">
        <button class="btn-act" style="flex:1; background:#f1f5f9;" onclick="closeCreateModal()">Annuler</button>
        <button class="btn-act" style="flex:1; background:var(--sidebar-bg); color:white;" onclick="createComp()">Créer</button>
      </div>
    </div>
  </div>

  <div class="modal" id="qrModal">
    <div class="modal-content" style="text-align:center">
      <h2 id="qrTitle" style="margin-bottom:20px">Accès Live</h2>
      <div id="qrcode" style="margin-bottom:20px; display:inline-block; border: 8px solid #fdf2f8; border-radius: 12px;"></div>
      <p id="qrUrl" style="font-size:0.75em; color:var(--text-light); word-break:break-all; margin-bottom:20px"></p>
      <button class="btn-act" style="width:100%; background:#f1f5f9;" onclick="closeQrModal()">Fermer</button>
    </div>
  </div>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyAvfMRtRrhh_e-27xHlwIx9c5DIdUQm6HM",
      authDomain: "resultats-tir-ligue-lr.firebaseapp.com",
      databaseURL: "https://resultats-tir-ligue-lr-default-rtdb.europe-west1.firebasedatabase.app",
      projectId: "resultats-tir-ligue-lr",
      storageBucket: "resultats-tir-ligue-lr.firebasestorage.app",
      appId: "1:468808300974:web:563a14cc4477c10b28303f"
    };

    firebase.initializeApp(firebaseConfig);
    const database = firebase.database();
    const GITHUB_BASE = "https://liguelrtir-lr.github.io/resultats-tir";

    function openCreateModal() { document.getElementById('createModal').classList.add('active'); }
    function closeCreateModal() { document.getElementById('createModal').classList.remove('active'); }

    function createComp() {
      const name = document.getElementById('newCompName').value.trim();
      const code = document.getElementById('newCompCode').value.trim().toUpperCase().replace(/\s/g, '_');
      const type = document.getElementById('newCompType').value;
      if (!name || !code) return alert("Remplis tout !");
      database.ref(code + '/config').set({ name, type }).then(() => {
          closeCreateModal();
          document.getElementById('newCompName').value = '';
          document.getElementById('newCompCode').value = '';
      });
    }

    function deleteComp(code, name) {
      if (confirm(`Supprimer définitivement "${name}" ?`)) database.ref(code).remove();
    }

    function openQr(code) {
      const url = `${GITHUB_BASE}/affichage_multicomp.html?comp=${code}`;
      document.getElementById('qrTitle').textContent = code;
      document.getElementById('qrUrl').textContent = url;
      const qrContainer = document.getElementById('qrcode');
      qrContainer.innerHTML = '';
      new QRCode(qrContainer, { text: url, width: 200, height: 200 });
      document.getElementById('qrModal').classList.add('active');
    }

    function closeQrModal() { document.getElementById('qrModal').classList.remove('active'); }

    database.ref().on('value', snap => {
      const grid = document.getElementById('compGrid');
      grid.innerHTML = '';
      const data = snap.val();
      if (!data) return;

      Object.keys(data).forEach(code => {
        const config = data[code].config;
        if (config && config.name) {
          const shooterCount = data[code].shooters ? Object.keys(data[code].shooters).length : 0;
          const card = document.createElement('div');
          card.className = 'card';
          card.innerHTML = `
            <div class="type-tag">${config.type || 'MULTI'}</div>
            <div class="card-title">${config.name}</div>
            <div class="card-code">#${code}</div>
            <div class="stat-pill">
               <span class="stat-label">Tireurs</span>
               <span class="stat-val">${shooterCount}</span>
            </div>
            <div class="actions-grid">
              <a href="saisie_multicomp.html?comp=${code}" class="btn-act btn-saisie">⌨️ SAISIE</a>
              <button onclick="openQr('${code}')" class="btn-act btn-qr">📱 QR CODE</button>
              <a href="affichage_multicomp.html?comp=${code}" target="_blank" class="btn-act btn-tv">📺 AFFICHAGE LIVE</a>
              <button onclick="deleteComp('${code}', '${config.name}')" class="btn-del">🗑️ Supprimer</button>
            </div>
          `;
          grid.appendChild(card);
        }
      });
    });

    setInterval(() => { document.getElementById('clock').textContent = new Date().toLocaleTimeString(); }, 1000);
  </script>
</body>
</html>
