<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Centre de Contrôle — Ligue LR</title>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-database-compat.js"></script>
    <style>
        /* Fond sympa : dégradé sportif */
        body { 
            font-family: 'Segoe UI', sans-serif; 
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%); 
            margin: 0; padding: 40px; 
            color: #333;
            min-height: 100vh;
        }
        
        .container { 
            max-width: 900px; margin: 0 auto; 
            background: rgba(255, 255, 255, 0.95); 
            padding: 30px; border-radius: 20px; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.3); 
        }

        h1 { text-align: center; color: #1e3c72; font-size: 2rem; margin-bottom: 30px; border-bottom: 2px solid #eee; padding-bottom: 15px; }

        /* Formulaire de création */
        .creation-box { 
            background: #f8f9fa; padding: 20px; border-radius: 12px; 
            display: flex; gap: 10px; margin-bottom: 40px; border: 1px solid #ddd;
        }
        input { flex: 1; padding: 12px; border: 2px solid #ddd; border-radius: 8px; font-size: 1rem; }
        .btn-create { background: #007bff; color: white; border: none; padding: 0 20px; border-radius: 8px; cursor: pointer; font-weight: bold; }

        /* Liste des compétitions */
        .comp-card { 
            background: white; border: 1px solid #eee; padding: 20px; 
            border-radius: 12px; margin-bottom: 15px; 
            display: flex; justify-content: space-between; align-items: center;
            transition: transform 0.2s; box-shadow: 0 4px 6px rgba(0,0,0,0.05);
        }
        .comp-card:hover { transform: translateY(-3px); box-shadow: 0 6px 12px rgba(0,0,0,0.1); }
        .comp-info h3 { margin: 0; color: #333; font-size: 1.2rem; }
        
        /* Boutons d'actions */
        .actions { display: flex; gap: 8px; }
        .btn { 
            text-decoration: none; padding: 10px 15px; border-radius: 6px; 
            font-size: 0.9rem; font-weight: bold; color: white; text-align: center;
        }
        .btn-saisie { background: #007bff; }
        .btn-tv { background: #6f42c1; }
        .btn-palmares { background: #28a745; }
        .btn-del { background: #dc3545; border: none; cursor: pointer; }

        .btn:hover { opacity: 0.85; }
    </style>
</head>
<body>

<div class="container">
    <h1>🎯 Gestion des Championnats</h1>

    <div class="creation-box">
        <input type="text" id="compName" placeholder="Ex: Régional TAR 2026, ISSF 10m...">
        <button class="btn-create" onclick="creerComp()">+ Créer</button>
    </div>

    <div id="compList">
        </div>
</div>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyAvfMRtRrhh_e-27xHlwIx9c5DIdUQm6HM",
        authDomain: "resultats-tir-ligue-lr.firebaseapp.com",
        databaseURL: "https://resultats-tir-ligue-lr-default-rtdb.europe-west1.firebasedatabase.app",
        projectId: "resultats-tir-ligue-lr",
        storageBucket: "resultats-tir-ligue-lr.firebasestorage.app",
        appId: "1:468808300974:web:563a14cc4477c10b28303f"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    function creerComp() {
        const name = document.getElementById('compName').value;
        if (!name) return alert("Nom requis");
        const id = name.replace(/\s+/g, '_').toLowerCase() + "_" + Date.now();
        db.ref(id).set({ name: name, id: id });
        document.getElementById('compName').value = '';
    }

    db.ref().on('value', (snap) => {
        const data = snap.val() || {};
        const list = document.getElementById('compList');
        list.innerHTML = '';
        
        Object.keys(data).forEach(key => {
            if (key === 'Ligue_Tireurs_Archive') return; // On n'affiche pas l'archive ici
            const comp = data[key];
            list.innerHTML += `
                <div class="comp-card">
                    <div class="comp-info">
                        <h3>${comp.name}</h3>
                    </div>
                    <div class="actions">
                        <a href="saisie_multicomp.html?comp=${key}" class="btn btn-saisie">Saisie</a>
                        <a href="affichage_multicomp.html?comp=${key}" class="btn btn-tv" target="_blank">TV</a>
                        <a href="classement_multicomp.html?comp=${key}" class="btn btn-palmares" target="_blank">Palmarès</a>
                        <button onclick="supprimerComp('${key}')" class="btn btn-del">🗑️</button>
                    </div>
                </div>
            `;
        });
    });

    function supprimerComp(id) {
        if(confirm("Supprimer cette compétition et TOUS ses scores ?")) {
            db.ref(id).remove();
        }
    }
</script>
</body>
</html>
