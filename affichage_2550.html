<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>🎯 Saisie & Affichage - 25/50m ISSF</title>

  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
  
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: #0f172a;
      color: #fff;
      margin: 0;
      padding-bottom: 80px;
    }

    .header {
      position: sticky;
      top: 0;
      z-index: 1000;
      text-align: center;
      padding: 18px;
      background: linear-gradient(135deg, #1e40af 0%, #3b82f6 100%);
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }
    .header h1 { font-size: 2em; margin: 0; font-weight: 950; color: #fff; text-transform: uppercase; }
    .header-clock { font-size: 1.5em; font-weight: 800; margin-top: 5px; color: rgba(255,255,255,0.9); }

    .ranking-container {
      background: #ffffff;
      border-radius: 20px;
      margin: 20px;
      overflow: hidden;
      color: #111;
      box-shadow: 0 20px 50px rgba(0,0,0,0.4);
    }

    .ranking-title {
      font-size: 1.8em;
      color: #1e3c72;
      text-align: center;
      padding: 20px;
      font-weight: 800;
      background: #f1f5f9;
      border-bottom: 3px solid #3b82f6;
    }

    table { width: 100%; border-collapse: collapse; }
    th { background: #1e293b; color: white; padding: 15px; text-transform: uppercase; font-size: 0.9em; text-align: left; }
    td { padding: 15px; border-bottom: 1px solid #e2e8f0; font-size: 1.2em; }

    /* Médailles */
    .medal-1 { background: linear-gradient(90deg, #ffd700, #fff2a3) !important; color: #000 !important; font-weight: bold; }
    .medal-2 { background: linear-gradient(90deg, #c0c0c0, #e8e8e8) !important; color: #000 !important; font-weight: bold; }
    .medal-3 { background: linear-gradient(90deg, #cd7f32, #ffb36b) !important; color: #000 !important; font-weight: bold; }

    .rank-cell { font-weight: 900; text-align: center; width: 60px; color: #1e3c72; }
    .medal-1 .rank-cell, .medal-2 .rank-cell, .medal-3 .rank-cell { color: #000; }

    .footer-bar {
      position: fixed;
      bottom: 0; width: 100%;
      background: rgba(15, 23, 42, 0.95);
      padding: 12px;
      text-align: center;
      z-index: 1000;
      border-top: 1px solid rgba(255,255,255,0.1);
    }
    .rotate-info { color: #60a5fa; font-weight: bold; text-transform: uppercase; font-size: 0.9em; }

    /* Animation */
    .live-indicator { display: inline-block; padding: 4px 12px; background: #ef4444; border-radius: 20px; font-weight: 800; font-size: 0.7em; animation: blink 2s infinite; margin-top: 5px; }
    @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }
  </style>
</head>
<body>

  <div class="header">
    <h1>🎯 Résultats Provisoires</h1>
    <div id="compNameDisplay" style="font-weight: 600; margin-top: 5px;">Chargement...</div>
    <div class="header-clock" id="headerClock">--:--:--</div>
    <div class="live-indicator">🔴 LIVE 25/50M</div>
  </div>

  <div class="ranking-container" id="rankingContainer"></div>

  <div class="footer-bar">
    <div class="rotate-info" id="rotateIndicator">Initialisation du cycle...</div>
  </div>

  <script>
    // Configuration Catégories (Minimes + Para-tir inclus)
    const CATEGORIES = [
      "Minimes Garçons", "Minimes Filles",
      "Cadets Garçons", "Cadetes Filles",
      "Juniors Garçons", "Juniors Filles",
      "Dames 1", "Dames 2", "Dames 3",
      "Seniors 1", "Seniors 2", "Seniors 3",
      "Para-tir P1", "Para-tir P2", "Para-tir P3", "Para-tir P4", "Para-tir P5"
    ];

    const COMP_ID = (new URLSearchParams(window.location.search).get('comp') || 'ISSF_25_50');

    const firebaseConfig = {
      apiKey: "AIzaSyAvfMRtRrhh_e-27xHlwIx9c5DIdUQm6HM",
      authDomain: "resultats-tir-ligue-lr.firebaseapp.com",
      databaseURL: "https://resultats-tir-ligue-lr-default-rtdb.europe-west1.firebasedatabase.app",
      projectId: "resultats-tir-ligue-lr",
      storageBucket: "resultats-tir-ligue-lr.firebasestorage.app",
      appId: "1:468808300974:web:563a14cc4477c10b28303f"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    let allShooters = [], views = [], currentIdx = 0, isPaused = false;

    // Délais de rotation
    const START_PAUSE = 3000; 
    const END_PAUSE = 2500;   
    const MIN_PAGE_TIME = 8000;

    // Écoute des données
    db.ref(`competitions/${COMP_ID}/config/name`).on('value', s => {
      document.getElementById('compNameDisplay').textContent = s.val() || 'Championnat 25/50m';
    });

    db.ref(`competitions/${COMP_ID}/shooters`).on('value', s => {
      allShooters = Object.values(s.val() || {});
      genererVues();
      lancerCycle();
    });

    function genererVues() {
      const map = new Map();
      allShooters.forEach(sh => {
        const key = `${sh.discipline}|${sh.category}`;
        if (!map.has(key)) map.set(key, { d: sh.discipline, c: sh.category });
      });
      views = Array.from(map.values()).sort((a,b) => a.d.localeCompare(b.d));
    }

    async function lancerCycle() {
      if (isPaused || !views.length) return;

      const vue = views[currentIdx];
      afficherTableau(vue);

      await new Promise(r => setTimeout(r, START_PAUSE));

      const totalHeight = document.body.scrollHeight;
      const viewHeight = window.innerHeight;

      if (totalHeight > viewHeight) {
        const dist = totalHeight - viewHeight;
        const duration = Math.max(MIN_PAGE_TIME, dist * 15);
        await smoothScroll(dist, duration);
        await new Promise(r => setTimeout(r, END_PAUSE));
      } else {
        await new Promise(r => setTimeout(r, MIN_PAGE_TIME));
      }

      currentIdx = (currentIdx + 1) % views.length;
      lancerCycle();
    }

    function afficherTableau(vue) {
      window.scrollTo(0, 0);
      const container = document.getElementById('rankingContainer');
      const data = allShooters
        .filter(s => s.discipline === vue.d && s.category === vue.c)
        .sort((a,b) => (Number(b.score)||0) - (Number(a.score)||0));

      let html = `<div class="ranking-title">${vue.d} <br> <small>${vue.c}</small></div>`;
      html += `<table><thead><tr><th>#</th><th>Tireur</th><th>Club</th><th style="text-align:right">Score</th></tr></thead><tbody>`;
      
      data.forEach((s, i) => {
        let medal = "";
        if (i === 0) medal = "medal-1";
        else if (i === 1) medal = "medal-2";
        else if (i === 2) medal = "medal-3";

        html += `<tr class="${medal}">
          <td class="rank-cell">${i+1}</td>
          <td><b>${s.lastName.toUpperCase()}</b> ${s.firstName}</td>
          <td>${s.club || ''}</td>
          <td style="text-align:right; font-weight:bold; color:#1e3a8a;">${s.score} <small style="opacity:0.5">/${s.maxScore}</small></td>
        </tr>`;
      });
      container.innerHTML = html + `</tbody></table>`;
      
      const next = views[(currentIdx + 1) % views.length];
      document.getElementById('rotateIndicator').textContent = next ? `PROCHAIN : ${next.d} ${next.c}` : "";
    }

    function smoothScroll(distance, duration) {
      return new Promise(resolve => {
        const start = performance.now();
        function step(now) {
          if (isPaused) return;
          const elapsed = now - start;
          const progress = Math.min(elapsed / duration, 1);
          window.scrollTo(0, distance * progress);
          if (progress < 1) requestAnimationFrame(step);
          else resolve();
        }
        requestAnimationFrame(step);
      });
    }

    setInterval(() => { document.getElementById('headerClock').textContent = new Date().toLocaleTimeString(); }, 1000);

    document.addEventListener('keydown', e => {
      if(e.code === 'Space') {
        e.preventDefault();
        isPaused = !isPaused;
        document.getElementById('rotateIndicator').textContent = isPaused ? "⏸ PAUSE" : "↻ REPRISE...";
        if (!isPaused) lancerCycle();
      }
    });
  </script>
</body>
</html>
