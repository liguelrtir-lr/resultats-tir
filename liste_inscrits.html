<!DOCTYPE html>
<!-- LIGUE LR — version v1.0 — 06/09/2026 -->
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Liste des inscrits</title>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-database-compat.js"></script>
    <style>
        :root {
            --primary-bordeaux: #4a2c40;
            --bg-pastel: #f8fafc;
            --text-dark: #0f172a;
            --text-light: #64748b;
            --border: #e2e8f0;
        }

        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background-color: var(--bg-pastel);
            color: var(--text-dark);
            margin: 0;
            padding: 24px;
        }

        .container { max-width: 900px; margin: 0 auto; }

        header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: var(--primary-bordeaux);
            color: white;
            padding: 20px 30px;
            border-radius: 16px;
            margin-bottom: 20px;
        }

        .header-logo { height: 60px; width: auto; object-fit: contain; }

        .header-center { text-align: center; flex: 1; }

        .header-center h1 { margin: 0; font-size: 1.5rem; font-weight: 800; }

        .poste-num { display: inline-block; min-width: 34px; text-align: center; font-weight: 800; font-size: 1.15em; border: 2px solid #333; border-radius: 6px; padding: 2px 6px; }
        .version-tag { font-size: 0.65em; opacity: 0.7; margin-top: -2px; margin-bottom: 4px; }

        .comp-name {
            margin-top: 4px;
            font-size: 1rem;
            color: #ffb8d9;
            font-weight: 600;
            text-transform: uppercase;
        }

        .toolbar {
            display: flex;
            gap: 10px;
            justify-content: flex-end;
            margin-bottom: 20px;
        }

        .btn-print {
            background: var(--primary-bordeaux);
            color: white;
            border: none;
            padding: 12px 22px;
            border-radius: 10px;
            font-weight: 700;
            font-size: 0.95rem;
            cursor: pointer;
        }
        .btn-print:hover { opacity: 0.9; }

        .generated-note {
            text-align: center;
            color: var(--text-light);
            font-size: 0.85rem;
            margin-bottom: 20px;
        }

        .serie-block {
            background: white;
            border-radius: 16px;
            padding: 20px 24px;
            margin-bottom: 24px;
            border: 1px solid var(--border);
            page-break-inside: avoid;
            break-inside: avoid;
        }

        .serie-header {
            display: flex;
            align-items: baseline;
            justify-content: space-between;
            border-bottom: 2px solid var(--primary-bordeaux);
            padding-bottom: 10px;
            margin-bottom: 14px;
        }

        .serie-title { font-size: 1.2rem; font-weight: 800; color: var(--primary-bordeaux); }
        .serie-count { font-size: 0.95rem; color: var(--text-light); font-weight: 600; }

        table { width: 100%; border-collapse: collapse; }

        th {
            text-align: left;
            color: var(--text-light);
            font-size: 0.78rem;
            text-transform: uppercase;
            padding: 6px 8px;
            border-bottom: 2px solid var(--border);
        }

        td { padding: 8px; border-bottom: 1px solid #f1f5f9; font-size: 0.98rem; }
        tr:last-child td { border-bottom: none; }

        .col-num { width: 34px; color: var(--text-light); }
        .col-poste { width: 90px; }
        .summary { display: flex; gap: 14px; flex-wrap: wrap; margin-bottom: 18px; }
        .summary .pill { background: white; border: 1px solid var(--border); border-radius: 12px; padding: 10px 16px; font-size: 0.9rem; color: var(--text-light); }
        .summary .pill b { color: var(--primary-bordeaux); font-size: 1.15rem; margin-left: 6px; }
        .eng { display: block; font-size: 0.85rem; color: var(--text-dark); white-space: nowrap; }
        .eng .p { display: inline-block; min-width: 26px; text-align: center; font-weight: 800; border: 1.5px solid #333; border-radius: 5px; padding: 0 4px; margin-left: 6px; font-size: 0.8rem; }
        .eng .d { color: var(--text-light); }
        .search-box { width: 100%; box-sizing: border-box; padding: 11px 14px; border: 1px solid var(--border); border-radius: 10px; font-size: 1rem; margin-bottom: 16px; }
        .letter td { background: #f1f5f9; font-weight: 800; color: var(--primary-bordeaux); padding: 4px 8px; font-size: 0.85rem; }
        @media print { .search-box, .toolbar { display: none !important; } }
        .poste-box {
            display: inline-block;
            width: 100%;
            min-height: 22px;
            border-bottom: 1.5px dotted var(--text-light);
        }

        .no-data { text-align: center; padding: 40px; color: var(--text-light); font-style: italic; }

        .warn-block {
            background: #fff7e6;
            border: 1px solid #fde3ad;
            border-radius: 16px;
            padding: 20px 24px;
            margin-bottom: 24px;
            page-break-inside: avoid;
        }
        .warn-title { font-size: 1.05rem; font-weight: 800; color: #b45309; margin-bottom: 10px; }

        .discipline-title {
            font-size: 1.1rem;
            font-weight: 800;
            color: var(--primary-bordeaux);
            margin: 18px 0 10px;
        }

        @media print {
            body { background: white; padding: 0; }
            header { border-radius: 0; }
            .toolbar { display: none; }
            .generated-note { margin-bottom: 14px; }
            .serie-block, .warn-block { box-shadow: none; }
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <img src="logo.png" alt="Logo Ligue LR" class="header-logo">
        <div class="header-center">
            <h1>👥 Liste des inscrits</h1>
            <div class="version-tag">v1.0</div>
            <div id="compTitle" class="comp-name">Chargement...</div>
        </div>
        <img src="logo.png" alt="Logo Ligue LR" class="header-logo">
    </header>

    <div class="toolbar">
        <button class="btn-print" onclick="window.print()">🖨️ Imprimer cette page</button>
    </div>
    <div class="generated-note" id="generatedNote"></div>
    <div class="summary" id="summary"></div>
    <input type="search" class="search-box" id="search" placeholder="Rechercher un nom, un club…" oninput="render()">

    <div id="content">
        <div class="no-data">Connexion au serveur en cours...</div>
    </div>
</div>

<script>
    const CONFIG = {
      clubName: "LIGUE LR",
      clubKey:  "LIGUE_LR",
      firebase: {
        apiKey: "AIzaSyAvfMRtRrhh_e-27xHlwIx9c5DIdUQm6HM",
        authDomain: "resultats-tir-ligue-lr.firebaseapp.com",
        databaseURL: "https://resultats-tir-ligue-lr-default-rtdb.europe-west1.firebasedatabase.app",
        projectId: "resultats-tir-ligue-lr",
        storageBucket: "resultats-tir-ligue-lr.firebasestorage.app",
        appId: "1:468808300974:web:563a14cc4477c10b28303f"
      }
    };

    firebase.initializeApp(CONFIG.firebase);
    const db = firebase.database();
    const CLUB_PATH = 'clubs/' + CONFIG.clubKey;
    const compId = new URLSearchParams(window.location.search).get('comp');

    document.title = "👥 " + CONFIG.clubName + " — Liste des inscrits";
    document.querySelectorAll('.header-logo').forEach(img => { img.alt = "Logo " + CONFIG.clubName; });

    // Logo personnalisé par compétition : si un fichier "logo_<code>.png" existe (uploadé sur
    // GitHub à côté des autres fichiers), il remplace le logo de la Ligue pour cette compétition
    // uniquement. Sinon, le logo de la Ligue (logo.png) reste affiché — aucun réglage requis.
    if (compId) {
        const customLogo = 'logo_' + compId + '.png';
        const test = new Image();
        test.onload = () => { document.querySelectorAll('.header-logo').forEach(img => { img.src = customLogo; }); };
        test.src = customLogo;
    }
    document.getElementById('generatedNote').textContent =
        "Généré le " + new Date().toLocaleDateString('fr-FR') + " à " + new Date().toLocaleTimeString('fr-FR', {hour:'2-digit', minute:'2-digit'});

    function formatSlotWhen(slot) {
        if (!slot.date) return '';
        const [y, m, d] = slot.date.split('-');
        return `${d}/${m}` + (slot.time ? ' ' + slot.time : '');
    }

    function sortedSlotEntries(data) {
        return Object.keys(data).map(slotId => [slotId, data[slotId]]).sort((a, b) => {
            const ka = a[1].datetime || null;
            const kb = b[1].datetime || null;
            if (ka && kb) return ka < kb ? -1 : (ka > kb ? 1 : 0);
            if (ka && !kb) return -1;
            if (!ka && kb) return 1;
            return 0;
        });
    }

    function escapeHtml(str) {
        return (str || '').toString().replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    }

    let lastShooters = null;
    let lastSlots = null;

    if (!compId) {
        document.getElementById('content').innerHTML = `<div class="no-data" style="color:red; font-weight:bold;">⚠️ Erreur : Aucune compétition spécifiée.</div>`;
    } else {
        db.ref(CLUB_PATH + '/' + compId + '/config').on('value', snap => {
            const config = snap.val();
            document.getElementById('compTitle').textContent = (config && config.name) ? config.name : "Compétition";
        });

        db.ref(CLUB_PATH + '/' + compId + '/slots').on('value', snap => {
            lastSlots = snap.val() || {};
            render();
        });

        db.ref(CLUB_PATH + '/' + compId + '/shooters').on('value', snap => {
            lastShooters = snap.val() || {};
            render();
        });
    }

    function slotLabel(slot) {
        const when = formatSlotWhen(slot);
        return when ? (slot.label ? `${when} — ${slot.label}` : when) : (slot.label || '(série sans nom)');
    }

    function render() {
        if (lastShooters === null || lastSlots === null) return;
        const q = (document.getElementById('search').value || '').trim().toLowerCase();

        // Lien engagement → série (via slots/registered)
        const slotOf = {};
        Object.keys(lastSlots).forEach(slotId => {
            const reg = lastSlots[slotId].registered || {};
            Object.keys(reg).forEach(id => { slotOf[id] = { slotId, poste: reg[id].poste || null, licence: reg[id].licence || '' }; });
        });
        const slotOrder = sortedSlotEntries(lastSlots).map(e => e[0]);

        // Regroupement par personne (Nom + Prénom) : une ligne par tireur, ses engagements listés à côté
        const people = {};
        Object.keys(lastShooters).forEach(id => {
            const s = lastShooters[id];
            const key = ((s.lastName || '').toUpperCase().trim()) + '|' + ((s.firstName || '').trim().toLowerCase());
            if (!people[key]) people[key] = { lastName: (s.lastName || '').toUpperCase(), firstName: s.firstName || '', club: s.club || '', category: s.category || '', licence: s.licence || '', engagements: [] };
            const p = people[key];
            if (!p.club && s.club) p.club = s.club;
            if (!p.licence) p.licence = s.licence || (slotOf[id] && slotOf[id].licence) || '';
            if (!p.category && s.category) p.category = s.category;
            const so = slotOf[id];
            p.engagements.push({ discipline: s.discipline || '', slotId: so ? so.slotId : null, poste: so ? so.poste : null });
        });

        let rows = Object.values(people).sort((a, b) =>
            a.lastName.localeCompare(b.lastName, 'fr') || a.firstName.localeCompare(b.firstName, 'fr'));
        const totalPeople = rows.length;
        const totalEng = Object.keys(lastShooters).length;

        document.getElementById('summary').innerHTML =
            `<div class="pill">Tireurs<b>${totalPeople}</b></div>` +
            `<div class="pill">Engagements (tireur × série/discipline)<b>${totalEng}</b></div>` +
            (Object.keys(lastSlots).length ? `<div class="pill">Séries<b>${Object.keys(lastSlots).length}</b></div>` : '');

        if (q) rows = rows.filter(p => (p.lastName + ' ' + p.firstName + ' ' + p.club + ' ' + p.licence).toLowerCase().includes(q));

        if (rows.length === 0) {
            document.getElementById('content').innerHTML = `<div class="no-data">${totalPeople ? 'Aucun tireur ne correspond à la recherche.' : 'Aucun tireur inscrit pour le moment.'}</div>`;
            return;
        }

        let html = `<div class="serie-block"><table><thead><tr>
            <th class="col-num">#</th><th>Nom</th><th>Prénom</th><th>Licence</th><th>Club</th><th>Catégorie</th><th>Engagements</th>
        </tr></thead><tbody>`;
        let letter = '';
        rows.forEach((p, i) => {
            const L = (p.lastName[0] || '').toUpperCase();
            if (L !== letter) { letter = L; html += `<tr class="letter"><td colspan="7">${escapeHtml(L)}</td></tr>`; }
            const engs = p.engagements
                .sort((a, b) => (slotOrder.indexOf(a.slotId) - slotOrder.indexOf(b.slotId)) || a.discipline.localeCompare(b.discipline))
                .map(e => {
                    const sl = e.slotId && lastSlots[e.slotId];
                    return `<span class="eng">${sl ? escapeHtml(slotLabel(sl)) + ' — ' : ''}<span class="d">${escapeHtml(e.discipline)}</span>${e.poste ? `<span class="p">${e.poste}</span>` : ''}</span>`;
                }).join('');
            html += `<tr>
                <td class="col-num">${i + 1}</td>
                <td><b>${escapeHtml(p.lastName)}</b></td>
                <td>${escapeHtml(p.firstName)}</td>
                <td>${escapeHtml(p.licence)}</td>
                <td>${escapeHtml(p.club)}</td>
                <td>${escapeHtml(p.category)}</td>
                <td>${engs}</td>
            </tr>`;
        });
        html += `</tbody></table></div>`;
        document.getElementById('content').innerHTML = html;
    }
</script>
</body>
</html>
