<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Affichage Live — Ligue LR</title>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-database-compat.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@700;800&family=JetBrains+Mono:wght@700&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg: #050b14;
            --surface: #0f172a;
            --accent: #00f2ff;
            --text: #ffffff;
        }

        body {
            background: var(--bg);
            color: var(--text);
            font-family: 'Plus Jakarta Sans', sans-serif;
            margin: 0;
            overflow: hidden; /* Important pour le scroll auto */
            height: 100vh;
        }

        /* BANDEAU DU HAUT AMÉLIORÉ */
        .header {
            background: var(--surface);
            padding: 20px 0;
            text-align: center;
            border-bottom: 3px solid var(--accent);
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .header-content {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 40px; /* Espace entre les armes et le texte */
        }

        .weapon-icon {
            font-size: 4rem; /* Très gros pour TV */
            filter: drop-shadow(0 0 15px var(--accent));
        }

        .icon-right {
            transform: scaleX(-1); /* Retourne l'arme de droite */
        }

        h1 {
            font-size: 3.5rem;
            margin: 0;
            text-transform: uppercase;
            font-weight: 800;
            letter-spacing: -1px;
        }

        /* TABLEAU ET SCROLL */
        .results-container {
            padding: 20px;
            margin-top: 10px;
        }

        table {
            width: 100%;
            border-collapse: separate;
            border-spacing: 0 10px;
        }

        th {
            background: rgba(255,255,255,0.05);
            padding: 15px;
            text-align: left;
            font-size: 1.2rem;
            color: var(--accent);
            text-transform: uppercase;
        }

        tr {
            background: rgba(255,255,255,0.02);
            transition: 0.3s;
        }

        td {
            padding: 20px 15px;
            font-size: 1.5rem;
            border-top: 1px solid rgba(255,255,255,0.05);
        }

        .rank { font-family: 'JetBrains Mono'; font-weight: 800; color: var(--accent); }
        .score { font-family: 'JetBrains Mono'; font-weight: 800; font-size: 1.8rem; text-align: right; }
    </style>
</head>
<body>

    <div class="header">
        <div class="header-content">
            <span id="iconLeft" class="weapon-icon">🎯</span>
            <h1 id="compName">CHARGEMENT...</h1>
            <span id="iconRight" class="weapon-icon icon-right">🎯</span>
        </div>
    </div>

    <div class="results-container" id="scrollContainer">
        <table id="resultsTable">
            <thead>
                <tr>
                    <th width="80">Pos</th>
                    <th>Nom du Tireur / Club</th>
                    <th width="150" style="text-align:right">Total</th>
                </tr>
            </thead>
            <tbody id="resultsBody">
                </tbody>
        </table>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyAvfMRtRrhh_e-27xHlwIx9c5DIdUQm6HM",
            authDomain: "resultats-tir-ligue-lr.firebaseapp.com",
            databaseURL: "https://resultats-tir-ligue-lr-default-rtdb.europe-west1.firebasedatabase.app",
            projectId: "resultats-tir-ligue-lr",
            storageBucket: "resultats-tir-ligue-lr.firebasestorage.app",
            appId: "1:468808300974:web:563a14cc4477c10b28303f"
        };

        firebase.initializeApp(firebaseConfig);
        const database = firebase.database();

        // Récupération du code compétition dans l'URL
        const params = new URLSearchParams(window.location.search);
        const compId = params.get('comp');

        if (!compId) {
            document.getElementById('compName').textContent = "ERREUR : AUCUN CODE";
        } else {
            database.ref(compId).on('value', snap => {
                const data = snap.val();
                if (!data) return;

                // 1. MISE À JOUR DU TITRE ET DES ARMES
                const config = data.config || {};
                document.getElementById('compName').textContent = config.name || "SANS TITRE";

                // Logique des armes selon le type
                let emoji = "🎯"; // Cible par défaut
                const type = config.type;
                if (type === "ISSF10" || type === "EDT") emoji = "🔫"; 
                if (type === "TAR" || type === "2550") emoji = "🔫"; // Tu peux changer pour une autre icône si besoin
                if (type === "MLAIC") emoji = "💨"; 

                document.getElementById('iconLeft').textContent = emoji;
                document.getElementById('iconRight').textContent = emoji;

                // 2. MISE À JOUR DES SCORES
                const shooters = data.shooters || {};
                const list = Object.keys(shooters).map(id => shooters[id]);
                
                // Tri par score décroissant
                list.sort((a, b) => (parseFloat(b.total) || 0) - (parseFloat(a.total) || 0));

                const body = document.getElementById('resultsBody');
                body.innerHTML = '';
                list.forEach((s, index) => {
                    const row = `
                        <tr>
                            <td class="rank">${index + 1}</td>
                            <td>
                                <strong>${s.nom.toUpperCase()}</strong><br>
                                <span style="font-size:0.8em; color:#8a99af">${s.club || ''}</span>
                            </td>
                            <td class="score">${s.total || '0'}</td>
                        </tr>
                    `;
                    body.innerHTML += row;
                });
            });
        }

        // --- SYSTÈME DE SCROLL AUTOMATIQUE ---
        function autoScroll() {
            const container = document.documentElement;
            const scrollHeight = container.scrollHeight;
            const clientHeight = container.clientHeight;
            
            if (scrollHeight > clientHeight) {
                let current = window.scrollY;
                if (current + clientHeight >= scrollHeight) {
                    setTimeout(() => window.scrollTo({ top: 0, behavior: 'smooth' }), 3000);
                } else {
                    window.scrollBy({ top: 1, behavior: 'auto' });
                }
            }
        }
        setInterval(autoScroll, 50); // Vitesse du scroll
    </script>
</body>
</html>
