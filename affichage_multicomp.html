<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>LIVE — Ligue LR</title>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-database-compat.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;700&family=Roboto:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #ffffff;
            --accent: #007bff;
            --gold: #fff9db; --gold-b: #fcc419;
            --silver: #f1f3f5; --silver-b: #adb5bd;
            --bronze: #fff4e6; --bronze-b: #fd7e14;
        }
        body { font-family: 'Roboto', sans-serif; background: var(--bg); color: #212529; margin: 0; overflow: hidden; }
        
        .header { background: #f8f9fa; padding: 10px; text-align: center; border-bottom: 2px solid var(--accent); }
        h1 { font-family: 'Oswald', sans-serif; margin: 0; font-size: 1.8rem; text-transform: uppercase; color: var(--accent); }

        .scroll-container { height: calc(100vh - 65px); overflow-y: hidden; padding: 0 20px; }

        .cat-header { position: sticky; top: 0; background: var(--bg); padding: 10px 0; z-index: 50; }
        .cat-title { background: #e9ecef; color: var(--accent); padding: 8px 15px; border-radius: 4px; font-family: 'Oswald', sans-serif; font-size: 1.4rem; border-left: 5px solid var(--accent); }

        table { width: 100%; border-collapse: separate; border-spacing: 0 4px; margin-bottom: 30px; }
        td { padding: 10px; font-size: 1.2rem; border-top: 1px solid #dee2e6; border-bottom: 1px solid #dee2e6; }

        /* MÉDAILLES SUR FOND BLANC */
        .m1 { background: var(--gold) !important; border-color: var(--gold-b) !important; color: #856404; }
        .m2 { background: var(--silver) !important; border-color: var(--silver-b) !important; color: #495057; }
        .m3 { background: var(--bronze) !important; border-color: var(--bronze-b) !important; color: #854226; }

        .rank { width: 50px; text-align: center; font-family: 'Oswald', sans-serif; font-weight: 700; }
        .score { text-align: right; font-family: 'Oswald', sans-serif; font-weight: 700; font-size: 1.5rem; color: var(--accent); padding-right: 20px; }
        .club { color: #6c757d; font-size: 0.85rem; text-transform: uppercase; }
    </style>
</head>
<body>

<div class="header"><h1 id="compTitle">CHARGEMENT...</h1></div>
<div class="scroll-container" id="scrollBox"><div id="content"></div></div>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyAvfMRtRrhh_e-27xHlwIx9c5DIdUQm6HM",
        authDomain: "resultats-tir-ligue-lr.firebaseapp.com",
        databaseURL: "https://resultats-tir-ligue-lr-default-rtdb.europe-west1.firebasedatabase.app",
        projectId: "resultats-tir-ligue-lr",
        storageBucket: "resultats-tir-ligue-lr.firebasestorage.app",
        appId: "1:468808300974:web:563a14cc4477c10b28303f"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();
    const params = new URLSearchParams(window.location.search);
    let compId = params.get('comp');

    if (compId) {
        // ON SCANNE TOUTE LA BASE POUR NE PAS RATER LE TAR
        db.ref().on('value', (snap) => {
            const all = snap.val();
            if (!all) return;

            // Détection (TAR_2026, tar_2026, competitions/TAR_2026, etc.)
            const idUpper = compId.toUpperCase();
            let data = all[idUpper] || all[compId] || (all.competitions ? (all.competitions[idUpper] || all.competitions[compId]) : null);

            if (data) {
                document.getElementById('compTitle').textContent = data.config ? data.config.name : compId;
                let raw = data.shooters || data.shootters || data;
                let shooters = Object.values(raw).filter(s => s && typeof s === 'object' && s.lastName);
                if (shooters.length > 0) render(shooters);
            }
        });
    }

    function render(shooters) {
        const content = document.getElementById('content');
        content.innerHTML = '';
        const groups = {};

        shooters.forEach(s => {
            let cat = s.discipline || s.category || "AUTRES";
            if (!groups[cat]) groups[cat] = [];
            groups[cat].push(s);
        });

        Object.keys(groups).sort().forEach(catName => {
            const sorted = groups[catName].sort((a,b) => (Number(b.score) || 0) - (Number(a.score) || 0));
            let html = `<div class="cat-header"><div class="cat-title">${catName}</div></div><table><tbody>`;
            
            sorted.forEach((s, i) => {
                const rank = i + 1;
                const m = rank === 1 ? "m1" : rank === 2 ? "m2" : rank === 3 ? "m3" : "";
                html += `<tr class="${m}">
                    <td class="rank">${rank}</td>
                    <td><b>${s.firstName} ${s.lastName.toUpperCase()}</b><div class="club">${s.club || ''}</div></td>
                    <td class="score">${s.score || 0}</td>
                </tr>`;
            });
            html += `</tbody></table>`;
            content.innerHTML += html;
        });
        startAutoScroll();
    }

    function startAutoScroll() {
        const box = document.getElementById('scrollBox');
        if (window.itv) clearInterval(window.itv);
        window.itv = setInterval(() => {
            box.scrollTop += 1;
            if (box.scrollTop + box.clientHeight >= box.scrollHeight - 1) {
                setTimeout(() => { box.scrollTop = 0; }, 3000);
            }
        }, 40);
    }
</script>
</body>
</html>
