<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>🎯 Résultats — Ligue LR Tir</title>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>

  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    /* HEADER LUMINEUX */
    .header {
      padding: 25px 40px;
      background: rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(10px);
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid rgba(255,255,255,0.2);
    }
    
    .comp-name { 
      font-size: 2.2em; 
      font-weight: 900; 
      text-transform: uppercase;
      letter-spacing: 2px;
      text-shadow: 0 4px 10px rgba(0,0,0,0.2);
    }

    .ranking-container {
      flex: 1;
      display: flex;
      flex-direction: column;
      padding: 30px;
      max-height: calc(100vh - 100px);
    }

    .view-title {
      background: #ffffff;
      color: #764ba2;
      padding: 15px;
      font-size: 1.8em;
      font-weight: 900;
      border-radius: 15px 15px 0 0;
      text-align: center;
      text-transform: uppercase;
      box-shadow: 0 10px 30px rgba(0,0,0,0.1);
    }

    .grid-header {
      display: grid;
      grid-template-columns: 80px 1fr 250px 150px;
      background: rgba(255, 255, 255, 0.2);
      padding: 20px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 1px;
      font-size: 1.1em;
      border-bottom: 2px solid rgba(255,255,255,0.3);
    }

    .grid-scroll {
      flex: 1;
      overflow-y: auto;
      background: rgba(255, 255, 255, 0.05);
      border-radius: 0 0 15px 15px;
      backdrop-filter: blur(5px);
    }

    .grid-scroll::-webkit-scrollbar { display: none; }

    .row {
      display: grid;
      grid-template-columns: 80px 1fr 250px 150px;
      padding: 20px;
      border-bottom: 1px solid rgba(255,255,255,0.1);
      align-items: center;
      font-size: 1.4em; 
      transition: background 0.3s;
    }

    .row:nth-child(even) { background: rgba(255,255,255,0.03); }

    .rank { 
      font-weight: 900; 
      font-size: 1.2em; 
      text-align: center;
    }

    .name { font-weight: 700; text-transform: capitalize; }
    .club { font-size: 0.8em; opacity: 0.9; font-style: italic; }
    .score { 
      font-weight: 900; 
      text-align: right; 
      font-size: 1.3em;
      color: #ffffff;
      background: rgba(255,255,255,0.15);
      padding: 5px 15px;
      border-radius: 10px;
    }

    /* --- STYLES DU PODIUM (Ligne entière) --- */

    /* OR - 1er */
    .row.rank-1 {
      background: linear-gradient(90deg, rgba(255, 215, 0, 0.8) 0%, rgba(255, 239, 148, 0.8) 100%) !important;
      color: #333; /* Texte sombre pour contraste */
      box-shadow: 0 5px 15px rgba(255, 215, 0, 0.3);
    }
    .row.rank-1 .rank, .row.rank-1 .name, .row.rank-1 .club, .row.rank-1 .score {
      color: #222 !important;
    }
    .row.rank-1 .score { background: rgba(0,0,0,0.1); }

    /* ARGENT - 2ème */
    .row.rank-2 {
      background: linear-gradient(90deg, rgba(192, 192, 192, 0.8) 0%, rgba(232, 232, 232, 0.8) 100%) !important;
      color: #333;
    }
    .row.rank-2 .rank, .row.rank-2 .name, .row.rank-2 .club, .row.rank-2 .score {
      color: #222 !important;
    }
    .row.rank-2 .score { background: rgba(0,0,0,0.1); }

    /* BRONZE - 3ème */
    .row.rank-3 {
      background: linear-gradient(90deg, rgba(205, 127, 50, 0.8) 0%, rgba(255, 179, 107, 0.8) 100%) !important;
      color: #fff; /* Texte blanc pour contraste sur le bronze */
    }
    .row.rank-3 .score { background: rgba(255,255,255,0.1); }


    .clock { font-family: 'Courier New', Courier, monospace; font-size: 1.8em; font-weight: bold; }
  </style>
</head>
<body>

  <div class="header">
    <div class="comp-name" id="compTitle">Chargement...</div>
    <div class="clock" id="clock">00:00:00</div>
  </div>

  <div class="ranking-container">
    <div class="view-title" id="currentViewTitle">Chargement des catégories...</div>
    <div class="grid-header">
      <div style="text-align: center;">#</div>
      <div>TIREUR</div>
      <div>CLUB</div>
      <div style="text-align: right;">SCORE</div>
    </div>
    <div class="grid-scroll" id="tableScroll">
      </div>
  </div>

  <script>
    // Config Firebase (Inchangée)
    const firebaseConfig = {
      apiKey: "AIzaSyAvfMRtRrhh_e-27xHlwIx9c5DIdUQm6HM",
      authDomain: "resultats-tir-ligue-lr.firebaseapp.com",
      databaseURL: "https://resultats-tir-ligue-lr-default-rtdb.europe-west1.firebasedatabase.app",
      projectId: "resultats-tir-ligue-lr",
      storageBucket: "resultats-tir-ligue-lr.firebasestorage.app",
      appId: "1:468808300974:web:563a14cc4477c10b28303f"
    };

    const app = firebase.initializeApp(firebaseConfig);
    const db = firebase.database();
    const urlParams = new URLSearchParams(window.location.search);
    const COMP_ID = urlParams.get('comp') || 'GENERAL';

    let allShooters = [];
    let rotateViews = [];
    let currentIdx = 0;
    let scrollTimer, rotateTimer;

    const perViewSeconds = 12; 
    const scrollPadding = 2500; 

    function init() {
      db.ref(`${COMP_ID}/config/name`).on('value', s => {
        document.getElementById('compTitle').textContent = s.val() || COMP_ID;
      });

      db.ref(`${COMP_ID}/shooters`).on('value', snap => {
        allShooters = snap.exists() ? Object.values(snap.val()) : [];
        prepareRotation();
      });

      setInterval(() => {
        document.getElementById('clock').textContent = new Date().toLocaleTimeString();
      }, 1000);
    }

    function prepareRotation() {
      const groups = {};
      allShooters.forEach(s => {
        const key = `${s.discipline} - ${s.category}`;
        if (!groups[key]) groups[key] = [];
        groups[key].push(s);
      });

      rotateViews = Object.keys(groups).sort().map(key => ({
        title: key,
        shooters: groups[key].sort((a, b) => b.score - a.score)
      }));

      if (rotateViews.length > 0) startRotation();
    }

    function startRotation() {
      clearTimeout(rotateTimer);
      showView();
    }

    function showView() {
      if (currentIdx >= rotateViews.length) currentIdx = 0;
      const view = rotateViews[currentIdx];
      document.getElementById('currentViewTitle').textContent = view.title;
      
      const container = document.getElementById('tableScroll');
      container.innerHTML = view.shooters.map((s, i) => {
        // Ajout dynamique de la classe de rang pour le style
        let rankClass = '';
        if (i === 0) rankClass = 'rank-1';
        else if (i === 1) rankClass = 'rank-2';
        else if (i === 2) rankClass = 'rank-3';

        return `
          <div class="row ${rankClass}">
            <div class="rank">${i + 1}</div>
            <div class="name">${s.lastName} ${s.firstName}</div>
            <div class="club">${s.club || ''}</div>
            <div class="score">${s.score}</div>
          </div>
        `;
      }).join('');

      container.scrollTop = 0;
      clearInterval(scrollTimer);

      setTimeout(() => {
        const maxScroll = container.scrollHeight - container.clientHeight;
        if (maxScroll > 10) {
          const duration = (perViewSeconds * 1000) - (scrollPadding * 2);
          const step = maxScroll / (duration / 30);
          
          scrollTimer = setInterval(() => {
            container.scrollTop += step;
            if (container.scrollTop >= maxScroll - 1) {
              clearInterval(scrollTimer);
              setTimeout(goNext, scrollPadding);
            }
          }, 30);
        } else {
          rotateTimer = setTimeout(goNext, perViewSeconds * 1000);
        }
      }, scrollPadding);
    }

    function goNext() {
      currentIdx++;
      showView();
    }

    init();
  </script>
</body>
</html>
