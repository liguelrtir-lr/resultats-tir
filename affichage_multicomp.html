<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Résultats Officiels — Ligue LR</title>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-database-compat.js"></script>
    <style>
        body { font-family: sans-serif; background: #0e2228; color: white; margin: 0; padding: 20px; text-align: center; }
        .container { max-width: 900px; margin: 0 auto; }
        .header { background: #153039; padding: 25px; border-radius: 12px; border: 1px solid #224f5e; margin-bottom: 20px; }
        h1 { margin: 0; color: white; text-transform: uppercase; }
        #status { color: #0fb8c9; font-weight: bold; margin-top: 5px; }
        table { width: 100%; border-collapse: collapse; background: #153039; border-radius: 10px; overflow: hidden; }
        th { background: #0fb8c9; color: #0e2228; padding: 15px; text-transform: uppercase; }
        td { padding: 12px; border-bottom: 1px solid #224f5e; text-align: left; }
        .score { font-weight: bold; text-align: right; color: #0fb8c9; font-size: 1.2em; }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1 id="compTitle">CHARGEMENT...</h1>
        <div id="status">Recherche des scores...</div>
    </div>
    <table>
        <thead>
            <tr><th>#</th><th>Tireur</th><th>Club</th><th style="text-align:right">Score</th></tr>
        </thead>
        <tbody id="resBody"></tbody>
    </table>
</div>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyAvfMRtRrhh_e-27xHlwIx9c5DIdUQm6HM",
        authDomain: "resultats-tir-ligue-lr.firebaseapp.com",
        databaseURL: "https://resultats-tir-ligue-lr-default-rtdb.europe-west1.firebasedatabase.app",
        projectId: "resultats-tir-ligue-lr",
        storageBucket: "resultats-tir-ligue-lr.firebasestorage.app",
        appId: "1:468808300974:web:563a14cc4477c10b28303f"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    const params = new URLSearchParams(window.location.search);
    const compId = params.get('comp');

    if (compId) {
        // On vérifie les deux chemins possibles dans Firebase
        const paths = [compId, 'competitions/' + compId];
        
        paths.forEach(path => {
            db.ref(path).on('value', (snap) => {
                const data = snap.val();
                if (!data) return;

                // SI ON TROUVE DES DONNÉES
                document.getElementById('compTitle').textContent = data.config ? data.config.name : compId;
                
                // DÉTECTION DES TIREURS (Dans shooters ou directement à la racine)
                let rawList = data.shooters || data.shootters || data;
                
                // On transforme en tableau et on filtre pour ne garder que les tireurs valides
                const shootersList = Object.values(rawList)
                    .filter(item => item && typeof item === 'object' && item.lastName)
                    .sort((a, b) => (b.score || 0) - (a.score || 0));

                if (shootersList.length > 0) {
                    render(shootersList);
                }
            });
        });
    }

    function render(list) {
        const tbody = document.getElementById('resBody');
        document.getElementById('status').textContent = list.length + " tireur(s) en direct";
        tbody.innerHTML = '';
        list.forEach((s, i) => {
            tbody.innerHTML += `<tr>
                <td style="color:#0fb8c9; font-weight:bold">${i+1}</td>
                <td>${s.firstName} ${s.lastName}</td>
                <td style="color:#94a3b8">${s.club || '-'}</td>
                <td class="score">${s.score || 0}</td>
            </tr>`;
        });
    }
</script>
</body>
</html>
