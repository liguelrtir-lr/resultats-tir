<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Résultats en Direct</title>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-database-compat.js"></script>
    <style>
        body { font-family: 'DM Sans', sans-serif; background: linear-gradient(135deg, #0e2228 0%, #050b0d 100%); color: white; margin: 0; padding: 20px; text-align: center; }
        .header { background: rgba(21, 48, 57, 0.8); padding: 20px; border-radius: 15px; border: 1px solid #224f5e; margin-bottom: 20px; }
        table { width: 100%; max-width: 900px; margin: 0 auto; border-collapse: collapse; background: #153039; border-radius: 10px; overflow: hidden; }
        th { background: #0fb8c9; color: #0e2228; padding: 15px; text-transform: uppercase; }
        td { padding: 12px; border-bottom: 1px solid #224f5e; }
        .score-cell { font-weight: bold; color: #0fb8c9; font-size: 1.2em; text-align: right; }
    </style>
</head>
<body>

<div class="header">
    <h1 id="compTitle">CHARGEMENT...</h1>
    <p id="status" style="color: #94a3b8;">Connexion à Firebase en cours...</p>
</div>

<table id="resultTable">
    <thead>
        <tr>
            <th>#</th>
            <th>Tireur</th>
            <th>Club</th>
            <th style="text-align: right;">Score</th>
        </tr>
    </thead>
    <tbody id="resBody"></tbody>
</table>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyAvfMRtRrhh_e-27xHlwIx9c5DIdUQm6HM",
        authDomain: "resultats-tir-ligue-lr.firebaseapp.com",
        databaseURL: "https://resultats-tir-ligue-lr-default-rtdb.europe-west1.firebasedatabase.app",
        projectId: "resultats-tir-ligue-lr",
        storageBucket: "resultats-tir-ligue-lr.firebasestorage.app",
        appId: "1:468808300974:web:563a14cc4477c10b28303f"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    // On récupère l'ID et on le force en MAJUSCULES pour correspondre à Firebase
    const params = new URLSearchParams(window.location.search);
    let rawId = params.get('comp') || "";
    const compId = rawId.toUpperCase(); 

    if (compId) {
        document.getElementById('status').textContent = "Recherche du dossier : " + compId;

        // On écoute le dossier (ex: TAR_2026)
        db.ref(compId).on('value', (snap) => {
            const fullData = snap.val();
            const tbody = document.getElementById('resBody');
            tbody.innerHTML = '';

            if (fullData && fullData.shooters) {
                document.getElementById('status').textContent = "Données trouvées !";
                document.getElementById('compTitle').textContent = fullData.config ? fullData.config.name : compId;

                const list = Object.values(fullData.shooters).sort((a,b) => b.score - a.score);
                list.forEach((t, index) => {
                    tbody.innerHTML += `
                        <tr>
                            <td>${index + 1}</td>
                            <td>${t.firstName} ${t.lastName}</td>
                            <td>${t.club || '-'}</td>
                            <td class="score-cell">${t.score}</td>
                        </tr>
                    `;
                });
            } else {
                document.getElementById('status').textContent = "Aucun tireur trouvé dans le dossier " + compId;
                tbody.innerHTML = '<tr><td colspan="4">En attente de résultats...</td></tr>';
            }
        });
    }
</script>
</body>
</html>
