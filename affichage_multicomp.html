<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🎯 Résultats en Direct - Tir Sportif</title>

  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>

  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    :root{ --sbw: 12px; }

    body{
      font-family:'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #0f2027 0%, #203a43 50%, #2c5364 100%);
      color: white;
      overflow-x: hidden;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .container{ max-width: 100%; margin: 0 auto; flex: 1; display: flex; flex-direction: column; }

    .header{
      position: relative; text-align: center; padding: 18px 30px;
      background: linear-gradient(135deg, #4f7cff 0%, #7c3aed 50%, #4f7cff 100%);
      overflow: hidden; z-index: 10;
    }
    .header h1{ font-size: 2em; font-weight: 950; letter-spacing: 2px; color: #ffffff; }
    .header .competition-name{ font-size: 1.1em; color: #ffffff; font-weight: 700; margin-bottom: 8px; }
    .header .live-indicator{
      display: inline-block; padding: 5px 14px; background: red; border-radius: 20px;
      font-weight: bold; font-size: 0.78em; animation: pulse 2s infinite;
    }
    .header-clock { font-size: 1.5em; font-weight: 900; color: rgba(255,255,255,0.9); margin-top: 6px; }

    .ranking-container{
      background: rgba(255,255,255,0.98); border-radius: 30px; padding: 22px;
      flex: 1; margin: 12px 16px 0 16px; color: #111; display: flex; flex-direction: column; overflow: hidden;
    }

    .ranking-title{ font-size: 1.8em; color: #1e3c72; text-align: center; margin-bottom: 18px; font-weight: 800; border-bottom: 4px solid rgba(30,60,114,0.1); padding-bottom: 10px; }

    .ranking-grid{ --col-rank: 65px; --col-club: 180px; --col-score: 150px; flex: 1; display: flex; flex-direction: column; overflow: hidden; }
    .grid-head{ display: grid; grid-template-columns: var(--col-rank) 1fr var(--col-club) var(--col-score); background: #1e3c72; color: #fff; border-radius: 12px; margin-bottom: 8px; }
    .hcell{ padding: 18px; font-weight: 800; text-transform: uppercase; font-size: 1.1em; text-align: center; }
    .hcell:nth-child(2) { text-align: left; }

    .grid-scroll{ flex: 1; overflow-y: auto; scroll-behavior: smooth; }
    .grid-row{ display: grid; grid-template-columns: var(--col-rank) 1fr var(--col-club) var(--col-score); align-items: center; margin-bottom: 7px; background: rgba(30,60,114,0.05); border-radius: 10px; }

    .cell{ padding: 18px; font-size: 1.15em; }
    .cell.rank{ text-align: center; font-weight: 900; font-size: 1.8em; color: #1e3c72; }
    .shooter-name{ font-weight: 700; color: #1e3c72; }
    .category-badge{ display: inline-block; padding: 4px 12px; border-radius: 15px; font-size: 0.85em; font-weight: 700; margin-left: 10px; background: #eee; }
    .cell.score{ text-align: center; font-weight: 900; font-size: 1.4em; }

    /* Podium Colors */
    .rank-1 .cell.rank{ color: #ffd700; text-shadow: 0 0 10px rgba(255,215,0,0.5); }
    .rank-2 .cell.rank{ color: #c0c0c0; }
    .rank-3 .cell.rank{ color: #cd7f32; }

    .auto-rotate-indicator{ text-align: center; padding: 5px; color: rgba(255,255,255,0.4); font-size: 0.75em; }
    .footer { text-align: center; padding: 10px; font-size: 0.7em; opacity: 0.5; }

    .fab-group { position: fixed; bottom: 20px; right: 20px; display: flex; flex-direction: column; gap: 10px; }
    .fab { width: 50px; height: 50px; border-radius: 50%; border: none; cursor: pointer; color: white; font-size: 1.2em; box-shadow: 0 4px 10px rgba(0,0,0,0.3); }
    .fab-pdf { background: #ef4444; } .fab-csv { background: #22c55e; }

    @keyframes pulse{ 0%, 100% { transform: scale(1); } 50% { transform: scale(1.05); } }
  </style>
</head>

<body>
  <div class="container">
    <div class="header">
      <h1>🎯 Résultats</h1>
      <div class="competition-name" id="competitionName">Chargement...</div>
      <div class="live-indicator">🔴 EN DIRECT</div>
      <div class="header-clock" id="headerClock">--:--:--</div>
    </div>

    <div class="ranking-container" id="rankingContainer"></div>
    <div class="auto-rotate-indicator" id="autoRotateIndicator"></div>

    <div class="footer">Dernière mise à jour : <span id="lastUpdate">-</span></div>
  </div>

  <div class="fab-group">
    <button class="fab fab-pdf" onclick="exportPDF()">📄</button>
    <button class="fab fab-csv" onclick="exportCSV()">📊</button>
  </div>

  <script>
    const COMPETITION_ID = new URLSearchParams(window.location.search).get('comp') || 'ISSF10';
    const firebaseConfig = {
      apiKey: "AIzaSyAvfMRtRrhh_e-27xHlwIx9c5DIdUQm6HM",
      authDomain: "resultats-tir-ligue-lr.firebaseapp.com",
      databaseURL: "https://resultats-tir-ligue-lr-default-rtdb.europe-west1.firebasedatabase.app",
      projectId: "resultats-tir-ligue-lr",
      storageBucket: "resultats-tir-ligue-lr.firebasestorage.app",
      messagingSenderId: "468808300974",
      appId: "1:468808300974:web:563a14cc4477c10b28303f"
    };

    firebase.initializeApp(firebaseConfig);
    const database = firebase.database();
    
    let allShooters = [], rotateViews = [], currentIdx = 0, competitionConfig = {};
    let autoRotateEnabled = true, perViewSeconds = 8, scrollPaddingSeconds = 2;
    let rotateTimer = null, scrollTimer = null;

    function normalizeKey(s){ return (s || '').toString().trim(); }

    function buildRotateViews() {
      const map = new Map();
      allShooters.forEach(s => {
        const d = normalizeKey(s.discipline), c = normalizeKey(s.category);
        if (!d) return;
        if (!map.has(d)) map.set(d, new Set());
        if (c) map.get(d).add(c);
      });
      const views = [];
      Array.from(map.keys()).sort().forEach(d => {
        const cats = Array.from(map.get(d)).sort();
        if (!cats.length) views.push({ mode:'disc_only', discipline:d });
        else cats.forEach(c => views.push({ mode:'combo', discipline:d, category:c }));
      });
      return views.length ? views : [{ mode:'disc_only', discipline:'Résultats' }];
    }

    // --- LOGIQUE DE DÉFILEMENT ET ROTATION ---
    function stopAutoRotate() {
      if (rotateTimer) clearInterval(rotateTimer);
      if (scrollTimer) clearInterval(scrollTimer);
      rotateTimer = null; scrollTimer = null;
    }

    function startAutoRotate() {
      stopAutoRotate();
      if (!rotateViews.length) return;

      const view = rotateViews[currentIdx];
      displayRanking(view);

      const scroller = document.getElementById('tableScroll');
      
      // SI LA LISTE EST LONGUE (DÉPASSE L'ÉCRAN)
      if (scroller && scroller.scrollHeight > scroller.clientHeight) {
        startAutoScroll(scroller);
      } 
      // SI LA LISTE EST COURTE
      else {
        rotateTimer = setInterval(() => {
          if (autoRotateEnabled) goNextView();
        }, perViewSeconds * 1000);
      }
      updateIndicator();
    }

    function startAutoScroll(scroller) {
      scroller.scrollTop = 0;
      const maxScroll = scroller.scrollHeight - scroller.clientHeight;
      // Vitesse calculée pour finir le scroll en (8s - pauses)
      const travelTime = (perViewSeconds - (scrollPaddingSeconds * 2)) * 1000;
      const step = maxScroll / (travelTime / 30);

      // On attend 2s en haut avant de bouger
      setTimeout(() => {
        if (!autoRotateEnabled) return;
        scrollTimer = setInterval(() => {
          scroller.scrollTop += step;
          if (scroller.scrollTop >= maxScroll - 1) {
            clearInterval(scrollTimer);
            // On attend 2s en bas avant de changer de page
            setTimeout(() => { if (autoRotateEnabled) goNextView(); }, scrollPaddingSeconds * 1000);
          }
        }, 30);
      }, scrollPaddingSeconds * 1000);
    }

    function goNextView() {
      currentIdx = (currentIdx + 1) % rotateViews.length;
      startAutoRotate();
    }

    function updateIndicator() {
      const next = rotateViews[(currentIdx + 1) % rotateViews.length];
      document.getElementById('autoRotateIndicator').textContent = 
        autoRotateEnabled ? `↻ Prochain : ${next.discipline} ${next.category || ''}` : "⏸ Mode TV en pause";
    }

    function displayRanking(view) {
      const container = document.getElementById('rankingContainer');
      const filtered = allShooters.filter(s => {
        if (view.mode === 'combo') return normalizeKey(s.discipline) === view.discipline && normalizeKey(s.category) === view.category;
        return normalizeKey(s.discipline) === view.discipline;
      }).sort((a,b) => (Number(b.score)||0) - (Number(a.score)||0));

      let html = `<div class="ranking-title">${view.discipline} ${view.category || ''}</div>
                  <div class="ranking-grid">
                    <div class="grid-head"><div class="hcell">#</div><div class="hcell">Tireur</div><div class="hcell">Club</div><div class="hcell">Score</div></div>
                    <div class="grid-scroll" id="tableScroll">`;

      filtered.forEach((s, i) => {
        const rCls = i < 3 ? `rank-${i+1}` : '';
        html += `<div class="grid-row ${rCls}">
          <div class="cell rank">${i+1}</div>
          <div class="cell"><span class="shooter-name">${s.firstName} ${s.lastName}</span>
            ${view.mode === 'disc_only' ? `<span class="category-badge">${s.category || ''}</span>` : ''}
          </div>
          <div class="cell" style="text-align:center">${s.club || ''}</div>
          <div class="cell score">${s.score} <small style="opacity:0.4; font-size:0.6em;">/${s.maxScore}</small></div>
        </div>`;
      });
      container.innerHTML = html + `</div></div>`;
      document.getElementById('lastUpdate').textContent = new Date().toLocaleTimeString();
    }

    // --- FIREBASE ET CLOCK ---
    database.ref(`${COMPETITION_ID}/config`).on('value', snap => {
      competitionConfig = snap.val() || {};
      document.getElementById('competitionName').textContent = competitionConfig.name || 'Compétition';
    });

    database.ref(`${COMPETITION_ID}/shooters`).on('value', snap => {
      allShooters = Object.entries(snap.val() || {}).map(([id, d]) => ({id, ...d}));
      rotateViews = buildRotateViews();
      startAutoRotate();
    });

    setInterval(() => { document.getElementById('headerClock').textContent = new Date().toLocaleTimeString(); }, 1000);
    document.addEventListener('keydown', e => { if(e.code==='Space'){ e.preventDefault(); autoRotateEnabled=!autoRotateEnabled; startAutoRotate(); }});

    // --- EXPORTS ---
    function exportPDF(){ /* Logique PDF identique */ alert('Génération PDF...'); }
    function exportCSV(){ /* Logique CSV identique */ alert('Export CSV...'); }
  </script>
</body>
</html>
