<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🎯 Résultats en Direct - Tir Sportif</title>

  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>

  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    body {
      font-family:'Segoe UI', sans-serif;
      background: linear-gradient(135deg, #0f2027 0%, #203a43 50%, #2c5364 100%);
      color: white;
      height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    /* HEADER */
    .header {
      padding: 20px;
      background: rgba(0,0,0,0.4);
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 2px solid #0fb8c9;
    }
    .comp-name { font-size: 1.8em; font-weight: 800; color: #0fb8c9; text-transform: uppercase; }

    /* ZONE DE CLASSEMENT FIXE POUR FORCER LE SCROLL */
    .ranking-container {
      flex: 1;
      display: flex;
      flex-direction: column;
      padding: 20px;
      max-height: calc(100vh - 100px); /* Laisse de la place pour le header */
    }

    .view-title {
      background: #0fb8c9;
      color: #0e2228;
      padding: 10px 20px;
      font-size: 1.5em;
      font-weight: bold;
      border-radius: 10px 10px 0 0;
      text-align: center;
    }

    .grid-header {
      display: grid;
      grid-template-columns: 60px 1fr 150px 100px;
      background: #1c3d49;
      padding: 15px;
      font-weight: bold;
      border-bottom: 2px solid #0fb8c9;
    }

    /* LA ZONE QUI DOIT DEFILER */
    .grid-scroll {
      flex: 1;
      overflow-y: auto; /* Important */
      background: rgba(255,255,255,0.05);
      border-radius: 0 0 10px 10px;
      position: relative;
    }

    /* Supprimer la barre de défilement visuelle pour l'effet TV */
    .grid-scroll::-webkit-scrollbar { display: none; }

    .row {
      display: grid;
      grid-template-columns: 60px 1fr 150px 100px;
      padding: 15px;
      border-bottom: 1px solid rgba(255,255,255,0.1);
      align-items: center;
      font-size: 1.2em;
    }

    .rank { font-weight: 800; font-size: 1.2em; color: #0fb8c9; }
    .name { font-weight: 600; }
    .club { font-size: 0.9em; opacity: 0.8; }
    .score { font-weight: 900; color: #18d9a0; text-align: right; font-size: 1.3em; }

    /* PODIUM COLORS */
    .row:nth-child(1) .rank { color: #ffd700; font-size: 1.5em; }
    .row:nth-child(2) .rank { color: #c0c0c0; }
    .row:nth-child(3) .rank { color: #cd7f32; }

    .indicator { position: fixed; bottom: 10px; right: 20px; font-size: 0.8em; opacity: 0.5; }
  </style>
</head>
<body>

  <div class="header">
    <div class="comp-name" id="compTitle">Chargement...</div>
    <div id="clock" style="font-family: monospace; font-size: 1.2em;">00:00:00</div>
  </div>

  <div class="ranking-container">
    <div class="view-title" id="currentViewTitle">---</div>
    <div class="grid-header">
      <div>RANG</div>
      <div>NOM PRENOM</div>
      <div>CLUB</div>
      <div style="text-align: right;">SCORE</div>
    </div>
    <div class="grid-scroll" id="tableScroll">
      </div>
  </div>

  <div class="indicator" id="rotateStatus">Rotation Active</div>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyAvfMRtRrhh_e-27xHlwIx9c5DIdUQm6HM",
      authDomain: "resultats-tir-ligue-lr.firebaseapp.com",
      databaseURL: "https://resultats-tir-ligue-lr-default-rtdb.europe-west1.firebasedatabase.app",
      projectId: "resultats-tir-ligue-lr",
      storageBucket: "resultats-tir-ligue-lr.firebasestorage.app",
      appId: "1:468808300974:web:563a14cc4477c10b28303f"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();
    const COMP_ID = new URLSearchParams(window.location.search).get('comp') || 'GENERAL';

    let allShooters = [];
    let rotateViews = [];
    let currentIdx = 0;
    let scrollTimer, rotateTimer;

    // CONFIGURATION TEMPS
    const perViewSeconds = 12; // Temps total par catégorie
    const scrollPadding = 2000; // Pause 2s en haut et en bas

    function init() {
      // Charger le titre
      db.ref(`${COMP_ID}/config/name`).on('value', s => {
        document.getElementById('compTitle').textContent = s.val() || COMP_ID;
      });

      // Charger les données
      db.ref(`${COMP_ID}/shooters`).on('value', snap => {
        allShooters = snap.exists() ? Object.values(snap.val()) : [];
        prepareRotation();
      });

      setInterval(() => {
        document.getElementById('clock').textContent = new Date().toLocaleTimeString();
      }, 1000);
    }

    function prepareRotation() {
      const groups = {};
      allShooters.forEach(s => {
        const key = `${s.discipline} - ${s.category}`;
        if (!groups[key]) groups[key] = [];
        groups[key].push(s);
      });

      rotateViews = Object.keys(groups).sort().map(key => ({
        title: key,
        shooters: groups[key].sort((a, b) => b.score - a.score)
      }));

      if (rotateViews.length > 0) startRotation();
    }

    function startRotation() {
      clearTimeout(rotateTimer);
      showView();
    }

    function showView() {
      if (!rotateViews[currentIdx]) { currentIdx = 0; }
      const view = rotateViews[currentIdx];
      document.getElementById('currentViewTitle').textContent = view.title;
      
      const container = document.getElementById('tableScroll');
      container.innerHTML = view.shooters.map((s, i) => `
        <div class="row">
          <div class="rank">${i + 1}</div>
          <div class="name">${s.lastName} ${s.firstName}</div>
          <div class="club">${s.club || ''}</div>
          <div class="score">${s.score}</div>
        </div>
      `).join('');

      // RESET SCROLL
      container.scrollTop = 0;
      clearInterval(scrollTimer);

      // DECLENCHEMENT DU SCROLL APRES PAUSE
      setTimeout(() => {
        const maxScroll = container.scrollHeight - container.clientHeight;
        if (maxScroll > 5) {
          // Calcul vitesse
          const duration = (perViewSeconds * 1000) - (scrollPadding * 2);
          const step = maxScroll / (duration / 30);
          
          scrollTimer = setInterval(() => {
            container.scrollTop += step;
            if (container.scrollTop >= maxScroll - 1) {
              clearInterval(scrollTimer);
              setTimeout(goNext, scrollPadding);
            }
          }, 30);
        } else {
          // Pas besoin de scroller, on attend juste
          rotateTimer = setTimeout(goNext, perViewSeconds * 1000);
        }
      }, scrollPadding);
    }

    function goNext() {
      currentIdx++;
      showView();
    }

    init();
  </script>
</body>
</html>
