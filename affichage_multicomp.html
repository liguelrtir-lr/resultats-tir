<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Centre de Contrôle — Résultats Tir</title>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-database-compat.js"></script>
    <style>
        body { font-family: sans-serif; background: #1a2a30; color: white; text-align: center; padding: 20px; }
        .header { display: flex; justify-content: space-between; align-items: center; max-width: 800px; margin: 0 auto 30px; }
        h1 { margin: 0; font-size: 1.8rem; }
        
        .btn-create { 
            background: #28a745; color: white; border: none; padding: 10px 20px; 
            border-radius: 5px; cursor: pointer; font-weight: bold; font-size: 1rem;
        }

        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 20px; max-width: 1000px; margin: 0 auto; }
        
        .card { 
            background: #243b45; padding: 20px; border-radius: 12px; border: 1px solid #34495e; 
            text-align: left; box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }
        .card h2 { margin: 0 0 5px 0; color: #0fb8c9; }
        .card .id { font-size: 0.8rem; color: #94a3b8; margin-bottom: 15px; }
        .card .count { color: #2ecc71; font-weight: bold; margin-bottom: 20px; }
        
        .btn { 
            display: block; width: 100%; padding: 10px; margin: 8px 0; border: none; 
            border-radius: 6px; cursor: pointer; text-decoration: none; text-align: center;
            font-weight: bold; font-size: 0.9rem; color: white;
        }
        .btn-saisie { background: #0fb8c9; }
        .btn-tv { background: #34495e; }
        .btn-del { background: #e74c3c; margin-top: 15px; opacity: 0.7; }
    </style>
</head>
<body>

    <div class="header">
        <h1>🎯 Centre de Contrôle</h1>
        <button class="btn-create" onclick="createNewComp()">+ Nouveau Dossier</button>
    </div>

    <div id="compGrid" class="grid">
        </div>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyAvfMRtRrhh_e-27xHlwIx9c5DIdUQm6HM",
        authDomain: "resultats-tir-ligue-lr.firebaseapp.com",
        databaseURL: "https://resultats-tir-ligue-lr-default-rtdb.europe-west1.firebasedatabase.app",
        projectId: "resultats-tir-ligue-lr",
        storageBucket: "resultats-tir-ligue-lr.firebasestorage.app",
        appId: "1:468808300974:web:563a14cc4477c10b28303f"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    // CHARGEMENT DES COMPÉTITIONS
    db.ref().on('value', (snap) => {
        const data = snap.val();
        const grid = document.getElementById('compGrid');
        grid.innerHTML = '';

        if (!data) return;

        Object.keys(data).forEach(id => {
            if (id === 'competitions') return; // On ignore l'ancien dossier
            
            const comp = data[id];
            const shooters = comp.shooters || comp;
            const count = Object.values(shooters).filter(s => s && s.lastName).length;
            const name = comp.config ? comp.config.name : id;

            grid.innerHTML += `
                <div class="card">
                    <h2>${name}</h2>
                    <div class="id">ID: ${id}</div>
                    <div class="count">${count} tireur(s) détecté(s)</div>
                    <a href="saisie.html?comp=${id}" class="btn btn-saisie">Saisie</a>
                    <a href="affichage_multicomp.html?comp=${id}" class="btn btn-tv">Affichage TV</a>
                    <button onclick="deleteComp('${id}')" class="btn btn-del">Supprimer</button>
                </div>
            `;
        });
    });

    // FONCTION POUR CRÉER UNE NOUVELLE COMPÉTITION
    function createNewComp() {
        const name = prompt("Nom de la compétition (ex: REGIONAUX MLAIC) :");
        if (!name) return;
        const id = prompt("ID Unique (ex: MLAIC_2026) - SANS ESPACES :").replace(/\s/g, '_');
        if (!id) return;

        db.ref(id + '/config').set({
            name: name,
            date: new Date().toISOString()
        }).then(() => {
            alert("Compétition créée ! Vous pouvez maintenant saisir des tireurs.");
        });
    }

    // FONCTION SUPPRIMER
    function deleteComp(id) {
        if (confirm("Voulez-vous vraiment supprimer " + id + " ?")) {
            db.ref(id).remove();
        }
    }
</script>
</body>
</html>
