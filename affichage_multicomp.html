<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🏆 Ligue LR — Palmarès en Direct</title>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-database-compat.js"></script>
    <style>
        :root {
            --primary-bordeaux: #4a2c40; /* Rose sombre / Lie de vin */
            --bg-pastel: #f8fafc;
            --text-dark: #0f172a;
            --text-light: #64748b;
        }

        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background-color: var(--bg-pastel);
            color: var(--text-dark);
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 1100px;
            margin: 0 auto;
        }

        /* BANDEAU EN-TÊTE AVEC LOGOS */
        header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: var(--primary-bordeaux);
            color: white;
            padding: 20px 30px;
            border-radius: 20px;
            margin-bottom: 30px;
            box-shadow: 0 10px 25px rgba(74, 44, 64, 0.15);
        }

        .header-logo {
            height: 75px;
            width: auto;
            object-fit: contain;
        }

        .header-center {
            text-align: center;
            flex: 1;
        }

        .header-center h1 {
            margin: 0;
            font-size: 2.2rem;
            font-weight: 800;
            letter-spacing: -0.5px;
        }

        .comp-name {
            margin-top: 5px;
            font-size: 1.1rem;
            color: #ffb8d9;
            font-weight: 600;
            text-transform: uppercase;
        }

        /* BLOCS DISCIPLINE */
        .discipline-section {
            background: white;
            border-radius: 20px;
            padding: 25px;
            margin-bottom: 35px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.02), 0 10px 15px -3px rgba(0, 0, 0, 0.03);
            border: 1px solid #edf2f7;
        }

        /* L'EFFET AIMANT POUR LA DISCIPLINE (STICKY) */
        .discipline-title {
            color: var(--primary-bordeaux);
            border-bottom: 3px solid var(--primary-bordeaux);
            padding: 15px 10px;
            margin-top: 0;
            margin-bottom: 20px;
            font-size: 1.6rem;
            font-weight: 800;
            position: sticky;
            top: 0; /* S'accroche en haut de l'écran */
            background: white; /* Cache les catégories qui passent en dessous */
            z-index: 10; /* Reste au premier plan */
            box-shadow: 0 10px 10px -10px rgba(0,0,0,0.1); /* Petite ombre esthétique */
        }

        /* BLOCS CATÉGORIES */
        .category-block {
            margin-bottom: 25px;
        }

        .category-title {
            background: #f1f5f9;
            color: #475569;
            padding: 8px 16px;
            border-radius: 10px;
            font-weight: 700;
            font-size: 1.1rem;
            margin-bottom: 12px;
            width: fit-content;
        }

        /* TABLEAU DES CLASSEMENTS */
        table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 15px;
        }

        th {
            text-align: left;
            color: var(--text-light);
            font-size: 0.85rem;
            text-transform: uppercase;
            padding: 10px 12px;
            border-bottom: 2px solid #e2e8f0;
        }

        td {
            padding: 14px 12px;
            border-bottom: 1px solid #f1f5f9;
            font-size: 1.1rem;
        }

        tr:last-child td {
            border-bottom: none;
        }

        .rank-cell {
            font-weight: 800;
            width: 50px;
            color: var(--text-light);
        }

        tr:nth-child(1) .rank-cell { color: #d97706; font-size: 1.3rem; } /* Or */
        tr:nth-child(2) .rank-cell { color: #475569; font-size: 1.2rem; } /* Argent */
        tr:nth-child(3) .rank-cell { color: #b45309; font-size: 1.15rem; } /* Bronze */

        .name-cell { font-weight: 600; }
        .club-cell { color: var(--text-light); }

        .score-cell {
            text-align: right;
            font-weight: 800;
            font-size: 1.25rem;
            color: var(--primary-bordeaux);
            width: 100px;
        }

        .no-data {
            text-align: center;
            padding: 40px;
            color: var(--text-light);
            font-style: italic;
            font-size: 1.2rem;
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <img src="logo.png" alt="Logo Ligue LR" class="header-logo">
        <div class="header-center">
            <h1>🏆 PALMARÈS PROVISOIRE</h1>
            <div id="compTitle" class="comp-name">Chargement...</div>
        </div>
        <img src="logo.png" alt="Logo Ligue LR" class="header-logo">
    </header>

    <div id="resultsContainer">
        <div class="no-data">Connexion au serveur de résultats en cours...</div>
    </div>
</div>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyAvfMRtRrhh_e-27xHlwIx9c5DIdUQm6HM",
        authDomain: "resultats-tir-ligue-lr.firebaseapp.com",
        databaseURL: "https://resultats-tir-ligue-lr-default-rtdb.europe-west1.firebasedatabase.app",
        projectId: "resultats-tir-ligue-lr",
        storageBucket: "resultats-tir-ligue-lr.firebasestorage.app",
        appId: "1:468808300974:web:563a14cc4477c10b28303f"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();
    const compId = new URLSearchParams(window.location.search).get('comp');

    if (!compId) {
        document.getElementById('resultsContainer').innerHTML = `<div class="no-data" style="color:red; font-weight:bold;">⚠️ Erreur : Aucune compétition spécifiée.</div>`;
    } else {
        db.ref(compId + '/config').on('value', snap => {
            const config = snap.val();
            document.getElementById('compTitle').textContent = (config && config.name) ? config.name : "Championnat en cours";
        });

        db.ref(compId + '/shooters').on('value', snap => {
            const data = snap.val() || {};
            const shooters = Object.keys(data).map(key => data[key]);

            if (shooters.length === 0) {
                document.getElementById('resultsContainer').innerHTML = `<div class="no-data">Aucun tireur enregistré pour le moment.</div>`;
                return;
            }

            const tree = {};
            shooters.forEach(s => {
                const disc = s.discipline || "Sans Discipline";
                const cat = s.category || "Général";
                if (!tree[disc]) tree[disc] = {};
                if (!tree[disc][cat]) tree[disc][cat] = [];
                tree[disc][cat].push(s);
            });

            let html = '';
            const sortedDisciplines = Object.keys(tree).sort();

            sortedDisciplines.forEach(disc => {
                html += `<div class="discipline-section">`;
                html += `<h2 class="discipline-title">🎯 ${disc}</h2>`;

                const sortedCategories = Object.keys(tree[disc]).sort();

                sortedCategories.forEach(cat => {
                    html += `<div class="category-block">`;
                    html += `<div class="category-title">👥 ${cat}</div>`;
                    html += `<table>
                                <thead>
                                    <tr>
                                        <th style="width: 50px;">Pl.</th>
                                        <th>Nom Prénom</th>
                                        <th>Club</th>
                                        <th style="text-align: right; width: 100px;">Score</th>
                                    </tr>
                                </thead>
                                <tbody>`;

                    const rankedShooters = tree[disc][cat].sort((a, b) => (b.score || 0) - (a.score || 0));

                    rankedShooters.forEach((s, index) => {
                        const displayScore = s.score !== undefined ? s.score : 0;
                        const medal = (index === 0) ? "🥇 " : (index === 1) ? "🥈 " : (index === 2) ? "🥉 " : "";
                        html += `<tr>
                                    <td class="rank-cell">${index + 1}</td>
                                    <td class="name-cell">${medal}${s.lastName} ${s.firstName}</td>
                                    <td class="club-cell">${s.club || '-'}</td>
                                    <td class="score-cell">${displayScore}</td>
                                 </tr>`;
                    });
                    html += `</tbody></table></div>`;
                });
                html += `</div>`;
            });

            document.getElementById('resultsContainer').innerHTML = html;
        });
    }

    // --- MOTEUR DE DÉFILEMENT AUTOMATIQUE ---
    let isScrolling = true;
    
    function startAutoScroll() {
        setInterval(() => {
            if (isScrolling) {
                // Si on arrive tout en bas de la page
                if ((window.innerHeight + window.scrollY) >= document.body.offsetHeight - 5) {
                    isScrolling = false; // On met en pause
                    
                    // On attend 3 secondes en bas pour lire les derniers
                    setTimeout(() => {
                        // On remonte tout en haut en douceur
                        window.scrollTo({ top: 0, behavior: 'smooth' });
                        
                        // On attend 2 secondes en haut avant de recommencer à descendre
                        setTimeout(() => { 
                            isScrolling = true; 
                        }, 2000);
                        
                    }, 3000); 
                } else {
                    // Sinon, on descend d'un pixel
                    window.scrollBy(0, 1);
                }
            }
        }, 30); // Vitesse : 30 millisecondes. Réduisez le chiffre pour aller plus vite, augmentez-le pour aller plus doucement.
    }

    // On lance le défilement 4 secondes après l'ouverture de la page
    setTimeout(startAutoScroll, 4000);
</script>
</body>
</html>
