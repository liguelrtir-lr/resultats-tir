<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>LIVE — Classement par Épreuves</title>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-database-compat.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Rajdhani:wght@500;700&display=swap" rel="stylesheet">
    <style>
        :root { --bg: #050b0d; --surface: #0e2228; --accent: #0fb8c9; --gold: #ffd700; --silver: #c0c0c0; --bronze: #cd7f32; }
        body { font-family: 'Rajdhani', sans-serif; background: var(--bg); color: white; margin: 0; padding: 0; overflow: hidden; }
        .header { background: linear-gradient(to bottom, #153039, var(--bg)); padding: 15px; text-align: center; border-bottom: 2px solid var(--accent); position: sticky; top: 0; z-index: 10; }
        h1 { font-family: 'Orbitron', sans-serif; margin: 0; font-size: 2rem; text-transform: uppercase; color: var(--accent); }
        .scroll-container { height: calc(100vh - 100px); overflow-y: hidden; padding: 0 20px; }
        .category-header { 
            background: rgba(15, 184, 201, 0.1); 
            color: var(--accent); 
            padding: 12px; 
            margin: 30px 0 10px 0; 
            border-radius: 4px; 
            font-family: 'Orbitron', sans-serif;
            font-size: 1.6rem;
            border-left: 4px solid var(--accent);
            text-align: left;
        }
        table { width: 100%; border-collapse: collapse; margin-bottom: 30px; background: var(--surface); }
        th { font-family: 'Orbitron', sans-serif; padding: 10px; color: var(--accent); border-bottom: 1px solid var(--accent); text-align: left; font-size: 0.9rem; }
        td { padding: 10px; font-size: 1.3rem; border-bottom: 1px solid rgba(255,255,255,0.05); }
        .rank { width: 60px; text-align: center; font-weight: bold; }
        .rank-1 { color: var(--gold); } .rank-2 { color: var(--silver); } .rank-3 { color: var(--bronze); }
        .score { text-align: right; color: var(--accent); font-family: 'Orbitron', sans-serif; font-weight: bold; padding-right: 15px; }
        .club { color: #94a3b8; font-size: 0.9rem; }
    </style>
</head>
<body>

<div class="header">
    <h1 id="compTitle">SCAN DES ÉPREUVES...</h1>
    <div id="status" style="font-size: 0.9rem; opacity: 0.7;">Initialisation...</div>
</div>

<div class="scroll-container" id="scrollBox">
    <div id="content"></div>
</div>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyAvfMRtRrhh_e-27xHlwIx9c5DIdUQm6HM",
        authDomain: "resultats-tir-ligue-lr.firebaseapp.com",
        databaseURL: "https://resultats-tir-ligue-lr-default-rtdb.europe-west1.firebasedatabase.app",
        projectId: "resultats-tir-ligue-lr",
        storageBucket: "resultats-tir-ligue-lr.firebasestorage.app",
        appId: "1:468808300974:web:563a14cc4477c10b28303f"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();
    const params = new URLSearchParams(window.location.search);
    const compId = params.get('comp');

    if (compId) {
        // ON ÉCOUTE TOUTE LA BASE POUR TROUVER LE DOSSIER
        db.ref().on('value', (snapshot) => {
            const allData = snapshot.val();
            if (!allData) return;

            // Recherche du dossier cible (racine ou competitions/)
            let targetData = allData[compId] || (allData.competitions ? allData.competitions[compId] : null);

            if (targetData) {
                document.getElementById('compTitle').textContent = targetData.config ? targetData.config.name : compId;
                
                // On récupère les tireurs (shooters ou vrac)
                let rawList = targetData.shooters || targetData.shootters || targetData;
                const shooters = Object.values(rawList).filter(s => s && s.lastName);

                if (shooters.length > 0) {
                    renderCategories(shooters);
                }
            } else {
                document.getElementById('status').textContent = "ID " + compId + " non trouvé.";
            }
        });
    }

    function renderCategories(shooters) {
        const content = document.getElementById('content');
        content.innerHTML = '';

        // Groupement par discipline
        const grouped = {};
        shooters.forEach(s => {
            const cat = s.discipline || s.category || "AUTRES";
            if (!grouped[cat]) grouped[cat] = [];
            grouped[cat].push(s);
        });

        // Affichage de chaque bloc
        Object.keys(grouped).sort().forEach(catName => {
            const sorted = grouped[catName].sort((a,b) => (b.score || 0) - (a.score || 0));
            
            let html = `<div class="category-header">${catName}</div>
                        <table>
                            <thead><tr><th>Rang</th><th>Tireur</th><th>Club</th><th style="text-align:right">Score</th></tr></thead>
                            <tbody>`;
            
            sorted.forEach((s, i) => {
                const rank = i + 1;
                const rClass = rank === 1 ? "rank-1" : rank === 2 ? "rank-2" : rank === 3 ? "rank-3" : "";
                const medal = rank === 1 ? "🥇 " : rank === 2 ? "🥈 " : rank === 3 ? "🥉 " : "";
                
                html += `<tr>
                            <td class="rank ${rClass}">${medal}${rank}</td>
                            <td>${s.firstName} <span style="text-transform:uppercase; font-weight:700;">${s.lastName}</span></td>
                            <td class="club">${s.club || '-'}</td>
                            <td class="score">${s.score || 0}</td>
                         </tr>`;
            });
            html += `</tbody></table>`;
            content.innerHTML += html;
        });

        document.getElementById('status').textContent = shooters.length + " tireurs classés par épreuve";
        startAutoScroll();
    }

    let scrollInterval;
    function startAutoScroll() {
        if (scrollInterval) clearInterval(scrollInterval);
        const box = document.getElementById('scrollBox');
        scrollInterval = setInterval(() => {
            box.scrollTop += 1;
            if (box.scrollTop + box.clientHeight >= box.scrollHeight - 1) {
                setTimeout(() => { box.scrollTop = 0; }, 3000);
            }
        }, 40);
    }
</script>
</body>
</html>
